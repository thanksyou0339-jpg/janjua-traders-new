<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<title>JANJUA — Online Shopping</title>


<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    max-width:100%;
    overflow-x:hidden;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f6f8;
    color:#17202a;
}


/* =========================================================
   HEADER
========================================================= */

.main-header{
    width:100%;
    background:#111827;
    color:#fff;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 2px 12px rgba(0,0,0,.15);
}

.header-inner{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding:12px 14px;
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-box{
    min-width:125px;
}

.logo{
    font-size:27px;
    font-weight:900;
    letter-spacing:2px;
    line-height:1;
}

.logo-sub{
    font-size:8px;
    letter-spacing:1.1px;
    margin-top:4px;
    opacity:.8;
}


/* =========================================================
   SEARCH
========================================================= */

.search-box{
    flex:1;
    position:relative;
}

.search-box input{
    width:100%;
    height:42px;
    border:0;
    outline:none;
    border-radius:22px;
    padding:0 18px;
    font-size:14px;
    background:#fff;
    color:#17202a;
}


/* =========================================================
   HERO / SLIDER
========================================================= */

.hero{
    width:100%;
    max-width:1200px;
    margin:12px auto 0;
    padding:0 10px;
}

.slider{
    width:100%;
    background:#111827;
    border-radius:16px;
    overflow:hidden;
    position:relative;
    padding:12px 0;
}

.slider-title{
    color:#fff;
    font-size:14px;
    font-weight:800;
    padding:0 14px 10px;
}

.slider-window{
    width:100%;
    overflow:hidden;
}

.slider-track{
    display:flex;
    width:max-content;
    gap:10px;
    padding:0 10px;
    will-change:transform;
}

.slider-card{
    width:105px;
    min-width:105px;
    height:125px;
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    text-decoration:none;
    color:#17202a;
    display:block;
    box-shadow:0 2px 8px rgba(0,0,0,.18);
}

.slider-card-image{
    width:100%;
    height:82px;
    background:#f4f4f4;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.slider-card-image img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

.slider-card-name{
    padding:6px 7px 2px;
    font-size:10px;
    line-height:1.25;
    font-weight:700;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.slider-card-price{
    padding:0 7px;
    font-size:10px;
    font-weight:900;
}


/* =========================================================
   CATEGORY BAR
========================================================= */

.category-section{
    width:100%;
    max-width:1200px;
    margin:12px auto 0;
    padding:0 10px;
}

.category-scroll{
    width:100%;
    overflow-x:auto;
    overflow-y:hidden;
    scrollbar-width:none;
}

.category-scroll::-webkit-scrollbar{
    display:none;
}

#categoryBar{
    display:flex;
    gap:8px;
    width:max-content;
    padding:2px 0;
}

.category-btn{
    border:1px solid #ddd;
    background:#fff;
    color:#333;
    border-radius:20px;
    padding:9px 16px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
}

.category-btn.active{
    background:#111827;
    color:#fff;
    border-color:#111827;
}


/* =========================================================
   SHOP AREA
========================================================= */

.shop-area{
    width:100%;
    max-width:1200px;
    margin:12px auto 0;
    padding:0 10px 30px;
}

.section-heading{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:12px 0;
}

.section-heading h2{
    margin:0;
    font-size:19px;
}

#productCount{
    font-size:12px;
    color:#777;
}


/* =========================================================
   PRODUCT GRID
========================================================= */

#productGrid{
    width:100%;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}


/* =========================================================
   PRODUCT CARD
========================================================= */

.product-card{
    background:#fff;
    border-radius:13px;
    overflow:hidden;
    border:1px solid #ececec;
    box-shadow:0 2px 9px rgba(0,0,0,.06);

    contain:layout paint;
    content-visibility:auto;
    contain-intrinsic-size:330px;
}

.product-image-wrap{
    width:100%;
    aspect-ratio:1 / 1;
    background:#f7f7f7;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
}

.product-image-wrap img{
    display:block;
    width:100%;
    height:100%;
    object-fit:contain;
}


/* =========================================================
   PRODUCT INFO
========================================================= */

.product-info{
    padding:10px;
}

.product-category{
    color:#777;
    font-size:10px;
    margin-bottom:5px;
}

.product-name{
    margin:0;
    font-size:14px;
    line-height:1.35;
    min-height:38px;

    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.product-description{
    margin:6px 0;
    color:#666;
    font-size:11px;
    line-height:1.4;

    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.product-price-row{
    display:flex;
    align-items:center;
    gap:7px;
    flex-wrap:wrap;
    margin-top:7px;
}

.product-price{
    font-size:16px;
    font-weight:900;
}

.product-old-price{
    color:#999;
    text-decoration:line-through;
    font-size:11px;
}

.delivery-info{
    margin-top:5px;
    color:#16803c;
    font-size:10px;
    font-weight:700;
}

.order-btn{
    display:block;
    width:100%;
    text-align:center;
    margin-top:9px;
    padding:10px 6px;
    border-radius:8px;
    background:#111827;
    color:#fff;
    text-decoration:none;
    font-size:12px;
    font-weight:900;
}


/* =========================================================
   LOADING
========================================================= */

.loading-box{
    width:100%;
    padding:35px 10px;
    text-align:center;
    color:#777;
}

.loading-spinner{
    width:28px;
    height:28px;
    border:3px solid #ddd;
    border-top-color:#111827;
    border-radius:50%;
    animation:spin .7s linear infinite;
    margin:0 auto 10px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}


/* =========================================================
   FOOTER
========================================================= */

.footer{
    background:#111827;
    color:#fff;
    text-align:center;
    padding:20px 10px;
    font-size:11px;
}

.footer strong{
    font-size:15px;
}


/* =========================================================
   TABLET
========================================================= */

@media(max-width:900px){

    #productGrid{
        grid-template-columns:repeat(3,1fr);
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .header-inner{
        padding:10px;
        gap:8px;
    }

    .logo-box{
        min-width:95px;
    }

    .logo{
        font-size:22px;
    }

    .logo-sub{
        font-size:6px;
    }

    .search-box input{
        height:38px;
        font-size:13px;
    }

    .hero{
        padding:0 7px;
    }

    .slider{
        border-radius:13px;
    }

    .slider-card{
        width:92px;
        min-width:92px;
        height:115px;
    }

    .slider-card-image{
        height:75px;
    }

    .category-section,
    .shop-area{
        padding-left:7px;
        padding-right:7px;
    }

    #productGrid{
        grid-template-columns:repeat(2,1fr);
        gap:8px;
    }

    .product-info{
        padding:8px;
    }

    .product-name{
        font-size:13px;
        min-height:35px;
    }

    .product-description{
        font-size:10px;
    }

    .product-price{
        font-size:14px;
    }

    .order-btn{
        font-size:11px;
        padding:9px 4px;
    }

}


/* =========================================================
   VERY SMALL MOBILE
========================================================= */

@media(max-width:360px){

    .logo-box{
        min-width:85px;
    }

    .logo{
        font-size:19px;
    }

    #productGrid{
        gap:6px;
    }

    .product-info{
        padding:7px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="main-header">

    <div class="header-inner">

        <div class="logo-box">

            <div class="logo">
                JANJUA
            </div>

            <div class="logo-sub">
                DIGITAL MARKETING
            </div>

        </div>


        <div class="search-box">

            <input
                type="search"
                id="searchInput"
                placeholder="Search products..."
                autocomplete="off"
            >

        </div>

    </div>

</header>


<!-- =====================================================
     AUTO PRODUCT SLIDER
===================================================== -->

<section class="hero">

    <div class="slider">

        <div class="slider-title">
            🔥 Featured Products
        </div>

        <div class="slider-window">

            <div
                id="sliderTrack"
                class="slider-track"
            ></div>

        </div>

    </div>

</section>


<!-- =====================================================
     CATEGORIES
===================================================== -->

<section class="category-section">

    <div class="category-scroll">

        <div id="categoryBar">

            <button
                class="category-btn active"
                type="button"
            >
                ALL
            </button>

        </div>

    </div>

</section>


<!-- =====================================================
     SHOP
===================================================== -->

<main class="shop-area">

    <div class="section-heading">

        <h2>
            All Products
        </h2>

        <span id="productCount">
            Loading...
        </span>

    </div>


    <div id="productGrid">

        <div class="loading-box">

            <div class="loading-spinner"></div>

            Loading products...

        </div>

    </div>

</main>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="footer">

    <strong>JANJUA</strong>

    <br>

    Digital Marketing & Online Shopping Platform

    <br><br>

    © 2026 JANJUA Traders

</footer>


<script
    type="module"
    src="shop-script.js"
></script>


</body>

</html>
