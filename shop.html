<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SARGODHA HUB — Online Digital Marketing Platform</title>

<style>

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f5f8;
color:#17202a;
}

/* HEADER */

.header{
position:sticky;
top:0;
z-index:1000;
background:linear-gradient(135deg,#111827,#1f2937);
color:white;
box-shadow:0 3px 15px rgba(0,0,0,.15);
overflow:hidden;
}

.header-inner{
width:94%;
max-width:1200px;
margin:auto;
padding:12px 0;
position:relative;
z-index:5;
}

.header-top{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
}

.logo-area{
position:relative;
min-width:260px;
text-align:center;
}

.logo{
font-size:25px;
font-weight:900;
white-space:nowrap;
position:relative;
z-index:5;
animation:logoPulse 2.5s ease-in-out infinite;
}

.logo span{color:#fbbf24}

.logo-subtitle{
margin-top:4px;
font-size:12px;
font-weight:bold;
color:#e5e7eb;
position:relative;
z-index:5;
}

/* SPACE ANIMATION */

.space-animation{
position:absolute;
inset:-45px -30px -45px -30px;
pointer-events:none;
opacity:.75;
}

.orbit{
position:absolute;
left:50%;
top:50%;
border:1px solid rgba(255,255,255,.20);
border-radius:50%;
transform:translate(-50%,-50%);
}

.orbit-one{
width:190px;
height:70px;
animation:orbitRotate 7s linear infinite;
}

.orbit-two{
width:250px;
height:95px;
animation:orbitRotateReverse 11s linear infinite;
}

.orbit-three{
width:310px;
height:120px;
animation:orbitRotate 15s linear infinite;
}

.planet{
position:absolute;
border-radius:50%;
box-shadow:0 0 10px rgba(255,255,255,.55);
}

.neptune{
width:13px;
height:13px;
background:#3b82f6;
top:2px;
left:50%;
}

.pluto{
width:9px;
height:9px;
background:#d1d5db;
right:10px;
top:50%;
}

.planet-small{
width:7px;
height:7px;
background:#fbbf24;
left:18px;
top:45%;
}

@keyframes orbitRotate{
from{transform:translate(-50%,-50%) rotate(0deg)}
to{transform:translate(-50%,-50%) rotate(360deg)}
}

@keyframes orbitRotateReverse{
from{transform:translate(-50%,-50%) rotate(360deg)}
to{transform:translate(-50%,-50%) rotate(0deg)}
}

@keyframes logoPulse{
0%,100%{transform:scale(1)}
50%{transform:scale(1.025)}
}

/* SEARCH */

.search-box{
flex:1;
max-width:520px;
position:relative;
z-index:10;
}

.search-box input{
width:100%;
border:0;
outline:0;
border-radius:25px;
padding:12px 18px;
font-size:15px;
background:white;
color:#111827;
direction:rtl;
}

/* MAIN */

.container{
width:94%;
max-width:1200px;
margin:18px auto;
}

.status{
display:none;
padding:12px 15px;
border-radius:12px;
margin-bottom:15px;
font-weight:bold;
text-align:center;
}

.status.show{display:block}

.status.error{
background:#fee2e2;
color:#991b1b;
}

.status.info{
background:#dbeafe;
color:#1e40af;
}

.status.ok{
background:#dcfce7;
color:#166534;
}

.hidden{display:none!important}

/* LOADER */

.loader-wrap{
display:flex;
justify-content:center;
align-items:center;
min-height:180px;
}

.loader{
width:42px;
height:42px;
border:5px solid #ddd;
border-top-color:#111827;
border-radius:50%;
animation:spin .8s linear infinite;
}

@keyframes spin{
to{transform:rotate(360deg)}
}

/* TITLES */

.section-title{
display:flex;
align-items:center;
justify-content:space-between;
margin:20px 0 12px;
}

.section-title h2{
margin:0;
font-size:21px;
}

.section-title small{
color:#6b7280;
}

/* CATEGORIES */

.categories{
display:flex;
gap:9px;
overflow-x:auto;
padding:4px 1px 10px;
scrollbar-width:none;
}

.categories::-webkit-scrollbar{
display:none;
}

.category-btn{
flex:0 0 auto;
border:1px solid #d1d5db;
background:white;
color:#374151;
border-radius:20px;
padding:9px 16px;
font-weight:bold;
cursor:pointer;
transition:.25s ease;
}

.category-btn:hover{
transform:translateY(-2px);
}

.category-btn.active{
background:#111827;
color:white;
border-color:#111827;
}

/* CUSTOMER SUPPORT */

.customer-support{
margin:18px 0 24px;
padding:18px;
background:linear-gradient(135deg,#ffffff,#f8fafc);
border-radius:20px;
border:1px solid #e5e7eb;
box-shadow:0 8px 25px rgba(0,0,0,.09);
text-align:center;
}

.support-title{
font-size:23px;
font-weight:900;
margin-bottom:5px;
color:#111827;
text-shadow:1px 2px 2px rgba(0,0,0,.12);
}

.support-subtitle{
color:#6b7280;
font-size:13px;
margin-bottom:15px;
}

.support-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:13px;
}

.support-card{
min-height:82px;
display:flex;
align-items:center;
gap:12px;
padding:13px 15px;
border-radius:17px;
color:white;
text-decoration:none;
box-shadow:
0 8px 0 rgba(0,0,0,.12),
0 12px 22px rgba(0,0,0,.18);
transform:perspective(700px) rotateX(2deg);
transition:.25s ease;
direction:ltr;
text-align:left;
}

.support-card:hover{
transform:perspective(700px) translateY(-4px) rotateX(3deg);
}

.support-card:active{
transform:translateY(2px);
}

.support-card.whatsapp{
background:linear-gradient(135deg,#22c55e,#059669);
}

.support-card.mobile{
background:linear-gradient(135deg,#2563eb,#1d4ed8);
}

.support-icon{
font-size:31px;
min-width:38px;
text-align:center;
filter:drop-shadow(2px 3px 2px rgba(0,0,0,.35));
}

.support-card small{
display:block;
font-size:11px;
opacity:.9;
margin-bottom:3px;
}

.support-card strong{
display:block;
font-size:18px;
font-weight:900;
letter-spacing:.3px;
text-shadow:1px 2px 3px rgba(0,0,0,.35);
word-break:break-all;
}

/* FEATURED */

.slider-box{
background:white;
border-radius:18px;
padding:12px;
box-shadow:0 5px 20px rgba(0,0,0,.07);
overflow:hidden;
}

.slider{
overflow:hidden;
width:100%;
}

.slider-track{
display:flex;
gap:12px;
width:max-content;
transition:transform .5s ease;
}

.feature-card{
width:190px;
min-width:190px;
background:#f9fafb;
border:1px solid #e5e7eb;
border-radius:14px;
padding:9px;
cursor:pointer;
transition:transform .25s ease,box-shadow .25s ease;
}

.feature-card:hover{
transform:translateY(-4px);
box-shadow:0 8px 20px rgba(0,0,0,.10);
}

.feature-image{
width:100%;
height:130px;
border-radius:10px;
background:white;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

.feature-image img{
width:100%;
height:100%;
object-fit:contain;
}

.feature-name{
font-weight:bold;
font-size:14px;
margin-top:8px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.feature-price{
color:#15803d;
font-size:15px;
font-weight:bold;
margin-top:4px;
}

/* PRODUCTS */

.products-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:14px;
}

.product-card{
background:white;
border-radius:16px;
overflow:hidden;
box-shadow:0 4px 16px rgba(0,0,0,.07);
border:1px solid #edf0f2;
display:flex;
flex-direction:column;
min-width:0;
}

.product-image-box{
width:100%;
height:210px;
background:#fff;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

.product-image-box img{
width:100%;
height:100%;
object-fit:contain;
display:block;
}

.no-image{
color:#9ca3af;
font-size:14px;
}

.product-body{
padding:12px;
display:flex;
flex-direction:column;
flex:1;
}

.product-category{
font-size:12px;
color:#6b7280;
margin-bottom:5px;
}

.product-name{
font-size:16px;
font-weight:bold;
line-height:1.4;
min-height:44px;
display:-webkit-box;
-webkit-line-clamp:2;
-webkit-box-orient:vertical;
overflow:hidden;
}

.price-row{
margin-top:8px;
display:flex;
align-items:center;
gap:8px;
flex-wrap:wrap;
}

.current-price{
color:#15803d;
font-size:18px;
font-weight:900;
}

.old-price{
color:#9ca3af;
text-decoration:line-through;
font-size:13px;
}

.delivery{
font-size:12px;
color:#2563eb;
margin-top:5px;
}

.product-description{
color:#6b7280;
font-size:12px;
line-height:1.5;
margin-top:7px;
display:-webkit-box;
-webkit-line-clamp:2;
-webkit-box-orient:vertical;
overflow:hidden;
}

.order-btn{
width:100%;
margin-top:10px;
padding:11px;
border:0;
border-radius:10px;
background:#111827;
color:white;
font-weight:bold;
cursor:pointer;
}

.order-btn:active{
transform:scale(.98);
}

.empty-box{
background:white;
padding:35px 15px;
border-radius:15px;
text-align:center;
color:#6b7280;
}

/* FOOTER */

footer{
margin-top:35px;
background:#111827;
color:white;
text-align:center;
padding:22px 10px;
}

footer strong{
font-size:19px;
}

footer p{
color:#9ca3af;
font-size:13px;
margin:7px 0 0;
}

/* RESPONSIVE */

@media(max-width:900px){

.products-grid{
grid-template-columns:repeat(3,1fr);
}

}

@media(max-width:650px){

.header-top{
flex-direction:column;
align-items:stretch;
}

.logo-area{
min-width:0;
}

.logo{
text-align:center;
}

.logo-subtitle{
text-align:center;
}

.search-box{
max-width:none;
}

.container{
width:95%;
}

.support-grid{
grid-template-columns:1fr;
}

.support-card{
min-height:76px;
}

.support-card strong{
font-size:17px;
}

.products-grid{
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.product-image-box{
height:175px;
}

.product-body{
padding:9px;
}

.product-name{
font-size:14px;
}

.current-price{
font-size:16px;
}

.feature-card{
width:155px;
min-width:155px;
}

.feature-image{
height:105px;
}

.space-animation{
opacity:.5;
}

}

@media(max-width:360px){

.products-grid{
grid-template-columns:1fr 1fr;
}

.product-image-box{
height:145px;
}

}

</style>
</head>

<body>

<header class="header">

<div class="header-inner">

<div class="header-top">

<div class="logo-area">

<div class="space-animation">

<div class="orbit orbit-one">
<span class="planet neptune"></span>
</div>

<div class="orbit orbit-two">
<span class="planet pluto"></span>
</div>

<div class="orbit orbit-three">
<span class="planet-small"></span>
</div>

</div>

<div class="logo">
SARGODHA <span>HUB</span>
</div>

<div class="logo-subtitle">
JANJUA DIGITAL MARKETING PLATFORM
</div>

</div>

<div class="search-box">

<input
id="searchInput"
type="search"
placeholder="Product تلاش کریں..."
autocomplete="off">

</div>

</div>

</div>

</header>

<main class="container">

<div id="pageStatus" class="status"></div>

<!-- CUSTOMER SUPPORT -->
<section id="customerSupport" class="customer-support hidden">

<div class="support-title">
📞 Customer Support
</div>

<div class="support-subtitle">
کسی بھی معلومات یا مدد کے لیے ہم سے رابطہ کریں۔
</div>

<div class="support-grid">

<a
id="supportWhatsApp"
class="support-card whatsapp hidden"
href="#">

<span class="support-icon">🟢</span>

<span>
<small>WhatsApp</small>
<strong id="supportWhatsAppNumber"></strong>
</span>

</a>

<a
id="supportMobile"
class="support-card mobile hidden"
href="#">

<span class="support-icon">📱</span>

<span>
<small>Mobile / Contact</small>
<strong id="supportMobileNumber"></strong>
</span>

</a>

</div>

</section>

<!-- CATEGORIES -->

<div class="section-title">
<h2>🛍 Categories</h2>
</div>

<div id="categories" class="categories"></div>

<!-- FEATURED -->

<div class="section-title">

<h2>⭐ Featured Products</h2>

<small id="productCount">
Loading...
</small>

</div>

<div class="slider-box">

<div id="sliderLoading" class="loader-wrap">

<div class="loader"></div>

</div>

<div id="slider" class="slider hidden">

<div id="sliderTrack" class="slider-track"></div>

</div>

</div>

<!-- ALL PRODUCTS -->

<div class="section-title">

<h2>📦 All Products</h2>

</div>

<div id="productsLoading" class="loader-wrap">

<div class="loader"></div>

</div>

<div id="productsGrid" class="products-grid"></div>

</main>

<footer>

<strong>JANJUA TRADERS</strong>

<p>
Quality Products • Easy Ordering • Home Delivery
</p>

</footer>

<script type="module" src="./shop-script.js"></script>

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
getFirestore,
doc,
getDoc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig={

apiKey:"AIzaSyA8_4KXAdfKWZ5mi5DaT9qiayL3h_Yzw",

authDomain:"janjua-traders.firebaseapp.com",

projectId:"janjua-traders",

storageBucket:"janjua-traders.firebasestorage.app",

messagingSenderId:"154904774188",

appId:"1:154904774188:web:1830f9d533e77dae6a7389"

};


const app=initializeApp(firebaseConfig);
const db=getFirestore(app);


const supportSection=
document.getElementById("customerSupport");

const whatsappCard=
document.getElementById("supportWhatsApp");

const whatsappNumber=
document.getElementById("supportWhatsAppNumber");

const mobileCard=
document.getElementById("supportMobile");

const mobileNumber=
document.getElementById("supportMobileNumber");


function cleanPhone(value){

return String(value||"").trim();

}


function makeWhatsAppLink(value){

let number=cleanPhone(value);

number=number.replace(/[^\d+]/g,"");

if(number.startsWith("+"))
number=number.substring(1);

if(number.startsWith("00"))
number=number.substring(2);

if(!number)
return "";

return "https://wa.me/"+number;

}


async function loadCustomerSupport(){

try{

const supportRef=
doc(db,"settings","customerSupport");

const snap=
await getDoc(supportRef);

if(!snap.exists())
return;

const data=snap.data();

const mobile=
cleanPhone(data.mobile);

const whatsapp=
cleanPhone(data.whatsapp);

let hasSupport=false;


if(mobile){

mobileNumber.textContent=mobile;

mobileCard.href="tel:"+mobile;

mobileCard.classList.remove("hidden");

hasSupport=true;

}else{

mobileCard.classList.add("hidden");

}


if(whatsapp){

whatsappNumber.textContent=whatsapp;

const link=
makeWhatsAppLink(whatsapp);

if(link){

whatsappCard.href=link;

whatsappCard.target="_blank";

whatsappCard.rel="noopener noreferrer";

whatsappCard.classList.remove("hidden");

hasSupport=true;

}

}else{

whatsappCard.classList.add("hidden");

}


if(hasSupport){

supportSection.classList.remove("hidden");

}

}catch(error){

console.log(
"Customer Support not available:",
error
);

}

}


loadCustomerSupport();

</script>

</body>
</html>
