<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JANJUA - Digital Marketing Online Shop</title>

<link rel="stylesheet" href="shop-style.css">
</head>

<body>

<header class="shop-header">

    <!-- Animated birds / nature -->
    <div class="nature-layer" aria-hidden="true">

        <span class="bird bird-1">🕊️</span>
        <span class="bird bird-2">🐦</span>
        <span class="bird bird-3">🦅</span>
        <span class="bird bird-4">🕊️</span>

        <span class="nature-spark spark-1">✦</span>
        <span class="nature-spark spark-2">✧</span>
        <span class="nature-spark spark-3">•</span>

    </div>


    <div class="brand-area">

        <div class="brand-title">
            JANJUA
        </div>

        <div class="brand-line">
            DIGITAL MARKETING
        </div>

        <div class="brand-subtitle">
            ONLINE SHOPPING PLATFORM
        </div>

    </div>


    <!-- Search -->
    <div class="search-box">

        <span class="search-icon">🔍</span>

        <input
            type="search"
            id="searchBox"
            dir="auto"
            placeholder="Product تلاش کریں..."
            autocomplete="off"
        >

    </div>

</header>


<!-- Categories -->

<nav
    id="categoryBar"
    class="category-bar"
    aria-label="Product Categories"
>

    <button
        type="button"
        class="category-btn active"
        data-category="All"
    >
        ✨ All
    </button>

</nav>


<main class="shop-container">


    <!-- Loading -->

    <div
        id="loadingMessage"
        class="loading-message"
    >

        <span class="loader"></span>

        <span>
            Products loading...
        </span>

    </div>


    <!-- Products -->

    <div
        id="productGrid"
        class="product-grid"
    ></div>


</main>


<footer class="shop-footer">

    <div class="footer-brand">
        JANJUA
    </div>

    <strong>
        DIGITAL MARKETING
    </strong>

    <p>
        ONLINE SHOPPING PLATFORM
    </p>

    <small>
        Quality Products • Easy Ordering • Fast Delivery
    </small>

</footer>


<script
    type="module"
    src="shop-script.js"
></script>

</body>
</html>
