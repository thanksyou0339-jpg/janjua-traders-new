<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital Janjua Trading - Online Shop</title>

<link rel="stylesheet" href="shop-style.css">
</head>

<body>

<header class="shop-header">

    <div class="brand-animation">
        <span>☁️</span>
        <strong>DIGITAL</strong>
        <strong>JANJUA</strong>
        <strong>TRADING</strong>
        <span>☁️</span>
    </div>

    <div class="shop-subtitle">
        DIGITAL ONLINE MARKETING PLATFORM
    </div>

    <div class="search-box">

        <input
            type="search"
            id="searchBox"
            dir="auto"
            placeholder="🔍 Product تلاش کریں"
        >

    </div>

</header>


<nav class="category-bar">

    <button type="button" onclick="showCategory('All')">
        All
    </button>

    <button type="button" onclick="showCategory('Shoes')">
        Shoes
    </button>

    <button type="button" onclick="showCategory('Clothes')">
        Clothes
    </button>

    <button type="button" onclick="showCategory('Beauty')">
        Beauty
    </button>

    <button type="button" onclick="showCategory('Electronics')">
        Electronics
    </button>

    <button type="button" onclick="showCategory('Other')">
        Other
    </button>

</nav>


<main class="shop-container">

    <div
        id="loadingMessage"
        style="
        text-align:center;
        padding:40px;
        font-size:18px;
        "
    >
        Products loading...
    </div>

    <div
        id="productGrid"
        class="product-grid"
    ></div>

</main>


<footer class="shop-footer">

    <strong>
        DIGITAL JANJUA TRADING
    </strong>

    <p>
        DIGITAL ONLINE MARKETING PLATFORM
    </p>

</footer>


<script
    type="module"
    src="shop-script.js"
></script>

</body>
</html>
