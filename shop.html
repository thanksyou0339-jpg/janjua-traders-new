<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>JANJUA — Online Shopping</title>

<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f5f8;
    color:#17202a;
}

/* ================= HEADER ================= */

.header{
    position:sticky;
    top:0;
    z-index:1000;
    background:linear-gradient(135deg,#111827,#1f2937);
    color:white;
    box-shadow:0 3px 15px rgba(0,0,0,.15);
}

.header-inner{
    width:94%;
    max-width:1200px;
    margin:auto;
    padding:12px 0;
}

.header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.logo{
    font-size:25px;
    font-weight:900;
    white-space:nowrap;
}

.logo span{
    color:#fbbf24;
}

.search-box{
    flex:1;
    max-width:520px;
    position:relative;
}

.search-box input{
    width:100%;
    border:0;
    outline:0;
    border-radius:25px;
    padding:12px 18px;
    font-size:15px;
    background:white;
    color:#111827;
    direction:rtl;
}

/* ================= MAIN ================= */

.container{
    width:94%;
    max-width:1200px;
    margin:18px auto;
}

/* ================= STATUS ================= */

.status{
    display:none;
    padding:12px 15px;
    border-radius:12px;
    margin-bottom:15px;
    font-weight:bold;
    text-align:center;
}

.status.show{
    display:block;
}

.status.error{
    background:#fee2e2;
    color:#991b1b;
}

.status.info{
    background:#dbeafe;
    color:#1e40af;
}

.status.ok{
    background:#dcfce7;
    color:#166534;
}

/* ================= LOADER ================= */

.loader-wrap{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:180px;
}

.loader{
    width:42px;
    height:42px;
    border:5px solid #ddd;
    border-top-color:#111827;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* ================= SECTION ================= */

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:20px 0 12px;
}

.section-title h2{
    margin:0;
    font-size:21px;
}

.section-title small{
    color:#6b7280;
}

/* ================= SLIDER ================= */

.slider-box{
    background:white;
    border-radius:18px;
    padding:12px;
    box-shadow:0 5px 20px rgba(0,0,0,.07);
    overflow:hidden;
}

.slider{
    overflow:hidden;
    width:100%;
}

.slider-track{
    display:flex;
    gap:12px;
    width:max-content;
    transition:transform .5s ease;
}

.feature-card{
    width:190px;
    min-width:190px;
    background:#f9fafb;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:9px;
    cursor:pointer;
}

.feature-image{
    width:100%;
    height:130px;
    border-radius:10px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.feature-image img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.feature-name{
    font-weight:bold;
    font-size:14px;
    margin-top:8px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.feature-price{
    color:#15803d;
    font-size:15px;
    font-weight:bold;
    margin-top:4px;
}

/* ================= CATEGORIES ================= */

.categories{
    display:flex;
    gap:9px;
    overflow-x:auto;
    padding:4px 1px 10px;
    scrollbar-width:none;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category-btn{
    flex:0 0 auto;
    border:1px solid #d1d5db;
    background:white;
    color:#374151;
    border-radius:20px;
    padding:9px 16px;
    font-weight:bold;
    cursor:pointer;
}

.category-btn.active{
    background:#111827;
    color:white;
    border-color:#111827;
}

/* ================= PRODUCTS GRID ================= */

.products-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}

.product-card{
    background:white;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 4px 16px rgba(0,0,0,.07);
    border:1px solid #edf0f2;
    display:flex;
    flex-direction:column;
    min-width:0;
}

.product-image-box{
    width:100%;
    height:210px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.product-image-box img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

.no-image{
    color:#9ca3af;
    font-size:14px;
}

.product-body{
    padding:12px;
    display:flex;
    flex-direction:column;
    flex:1;
}

.product-category{
    font-size:12px;
    color:#6b7280;
    margin-bottom:5px;
}

.product-name{
    font-size:16px;
    font-weight:bold;
    line-height:1.4;
    min-height:44px;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.price-row{
    margin-top:8px;
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
}

.current-price{
    color:#15803d;
    font-size:18px;
    font-weight:900;
}

.old-price{
    color:#9ca3af;
    text-decoration:line-through;
    font-size:13px;
}

.delivery{
    font-size:12px;
    color:#2563eb;
    margin-top:5px;
}

.product-description{
    color:#6b7280;
    font-size:12px;
    line-height:1.5;
    margin-top:7px;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.order-btn{
    width:100%;
    margin-top:10px;
    padding:11px;
    border:0;
    border-radius:10px;
    background:#111827;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.order-btn:active{
    transform:scale(.98);
}

/* ================= EMPTY ================= */

.empty-box{
    background:white;
    padding:35px 15px;
    border-radius:15px;
    text-align:center;
    color:#6b7280;
}

/* ================= FOOTER ================= */

footer{
    margin-top:35px;
    background:#111827;
    color:white;
    text-align:center;
    padding:22px 10px;
}

footer strong{
    font-size:19px;
}

footer p{
    color:#9ca3af;
    font-size:13px;
    margin:7px 0 0;
}

/* ================= MOBILE ================= */

@media(max-width:900px){

    .products-grid{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:650px){

    .header-top{
        flex-direction:column;
        align-items:stretch;
    }

    .logo{
        text-align:center;
    }

    .search-box{
        max-width:none;
    }

    .container{
        width:95%;
    }

    .products-grid{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .product-image-box{
        height:175px;
    }

    .product-body{
        padding:9px;
    }

    .product-name{
        font-size:14px;
    }

    .current-price{
        font-size:16px;
    }

    .feature-card{
        width:155px;
        min-width:155px;
    }

    .feature-image{
        height:105px;
    }

}

@media(max-width:360px){

    .products-grid{
        grid-template-columns:1fr 1fr;
    }

    .product-image-box{
        height:145px;
    }

}

</style>

</head>


<body>


<header class="header">

    <div class="header-inner">

        <div class="header-top">

            <div class="logo">
                JANJUA <span>TRADERS</span>
            </div>

            <div class="search-box">

                <input
                    id="searchInput"
                    type="search"
                    placeholder="Product تلاش کریں..."
                    autocomplete="off"
                >

            </div>

        </div>

    </div>

</header>


<main class="container">


    <div
        id="pageStatus"
        class="status"
    ></div>


    <!-- FEATURED -->

    <div class="section-title">

        <h2>
            ⭐ Featured Products
        </h2>

        <small id="productCount">
            Loading...
        </small>

    </div>


    <div class="slider-box">

        <div
            id="sliderLoading"
            class="loader-wrap"
        >

            <div class="loader"></div>

        </div>


        <div
            id="slider"
            class="slider hidden"
        >

            <div
                id="sliderTrack"
                class="slider-track"
            ></div>

        </div>

    </div>


    <!-- CATEGORIES -->

    <div class="section-title">

        <h2>
            🛍 Categories
        </h2>

    </div>


    <div
        id="categories"
        class="categories"
    ></div>


    <!-- PRODUCTS -->

    <div class="section-title">

        <h2>
            📦 All Products
        </h2>

    </div>


    <div
        id="productsLoading"
        class="loader-wrap"
    >

        <div class="loader"></div>

    </div>


    <div
        id="productsGrid"
        class="products-grid"
    ></div>


</main>


<footer>

    <strong>
        JANJUA TRADERS
    </strong>

    <p>
        Quality Products • Easy Ordering • Home Delivery
    </p>

</footer>


<script type="module" src="./shop-script.js"></script>


</body>

</html>
