<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JANJUA - Admin Panel</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f5f8;
    color:#17202a;
}

.main-header{
    background:linear-gradient(135deg,#063d2d,#0b5b43,#063d2d);
    color:#fff;
    text-align:center;
    padding:22px 12px 18px;
    box-shadow:0 4px 14px rgba(0,0,0,.18);
}

.janjua-animation{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:3px;
    direction:ltr;
}

.j-letter{
    position:relative;
    display:inline-block;
    font-size:38px;
    font-weight:900;
    color:#f7d774;
    text-shadow:0 2px 5px rgba(0,0,0,.4);
    animation:janjuaFloat 2.8s ease-in-out infinite;
}

.j-letter:nth-child(2){animation-delay:.15s}
.j-letter:nth-child(3){animation-delay:.30s}
.j-letter:nth-child(4){animation-delay:.45s}
.j-letter:nth-child(5){animation-delay:.60s}
.j-letter:nth-child(6){animation-delay:.75s}

.decor{
    position:absolute;
    font-size:12px;
    font-style:normal;
    color:#fff;
    animation:decorSpin 3s ease-in-out infinite;
}

.d1{top:-5px;left:-5px}
.d2{bottom:-4px;right:-5px}
.d3{top:-7px;right:-4px}
.d4{bottom:-5px;left:-5px}
.d5{top:-5px;left:-5px}
.d6{bottom:-4px;right:-4px}

@keyframes janjuaFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-4px)}
}

@keyframes decorSpin{
    0%,100%{transform:rotate(0) scale(1)}
    50%{transform:rotate(15deg) scale(1.15)}
}

.platform-title{
    margin-top:5px;
    font-size:13px;
    font-weight:bold;
    letter-spacing:1px;
}

.container{
    width:95%;
    max-width:1000px;
    margin:20px auto;
}

.card{
    background:#fff;
    border-radius:14px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
}

.card h2{
    margin-top:0;
    color:#07583f;
    font-size:21px;
}

label{
    display:block;
    font-weight:bold;
    margin:13px 0 6px;
}

input,
select,
textarea{
    width:100%;
    border:1px solid #ccd4da;
    border-radius:9px;
    padding:12px;
    font-size:15px;
    outline:none;
    background:#fff;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#087b57;
    box-shadow:0 0 0 2px rgba(8,123,87,.08);
}

textarea{
    min-height:100px;
    resize:vertical;
}

.ltr{
    direction:ltr;
    text-align:left;
}

.password-box{
    position:relative;
}

.password-box input{
    padding-right:45px;
}

.eye-btn{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:none;
    cursor:pointer;
    font-size:19px;
}

button{
    border:0;
    border-radius:9px;
    padding:12px 18px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.primary-btn{
    width:100%;
    background:#087b57;
    color:white;
    margin-top:18px;
}

.primary-btn:hover{
    background:#065d43;
}

.secondary-btn{
    background:#e8f1ed;
    color:#07583f;
    margin-top:10px;
    width:100%;
}

.danger-btn{
    background:#c62828;
    color:#fff;
}

.small-btn{
    padding:8px 11px;
    font-size:13px;
}

.message{
    padding:11px;
    border-radius:8px;
    margin-top:12px;
    display:none;
    white-space:pre-line;
    direction:ltr;
    text-align:left;
    word-break:break-word;
}

.success{
    background:#e6f6ed;
    color:#09633f;
    border:1px solid #a9dfc4;
}

.error{
    background:#fdeaea;
    color:#a51d1d;
    border:1px solid #efb1b1;
}

.info{
    background:#e9f3ff;
    color:#18558c;
    border:1px solid #bdd8f2;
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.logout-btn{
    background:#b71c1c;
    color:#fff;
}

.user-info{
    background:#f1f5f3;
    border-radius:8px;
    padding:10px;
    font-size:13px;
    direction:ltr;
    text-align:left;
    word-break:break-all;
}

.file-note{
    font-size:12px;
    color:#6b7379;
    margin-top:5px;
}

.preview{
    display:none;
    margin-top:12px;
    text-align:center;
}

.preview img{
    max-width:220px;
    max-height:220px;
    border-radius:12px;
    border:1px solid #ddd;
    object-fit:contain;
}

.progress{
    display:none;
    margin-top:10px;
}

.progress-bar{
    height:8px;
    background:#087b57;
    border-radius:20px;
    width:0%;
}

.search-box{
    margin-bottom:15px;
}

.product-item{
    border:1px solid #dde3e7;
    border-radius:12px;
    padding:13px;
    margin-bottom:12px;
    display:flex;
    gap:13px;
    align-items:center;
    background:#fff;
}

.product-item img{
    width:90px;
    height:90px;
    object-fit:cover;
    border-radius:9px;
    background:#eee;
}

.product-info{
    flex:1;
    min-width:0;
}

.product-name{
    font-weight:bold;
    font-size:17px;
    margin-bottom:5px;
}

.product-id{
    font-size:12px;
    color:#6b7379;
    direction:ltr;
    text-align:left;
}

.product-price{
    color:#087b57;
    font-weight:bold;
    margin-top:4px;
}

.product-actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.copy-btn{
    background:#e8f1ed;
    color:#07583f;
}

.empty{
    text-align:center;
    padding:25px;
    color:#777;
}

.hidden{
    display:none !important;
}

.loading{
    opacity:.6;
    pointer-events:none;
}

.badge{
    display:inline-block;
    background:#eef6f2;
    color:#087b57;
    border-radius:20px;
    padding:5px 9px;
    font-size:12px;
    margin-top:5px;
}

hr{
    border:0;
    border-top:1px solid #e3e7e9;
    margin:20px 0;
}

@media(max-width:600px){

    .j-letter{
        font-size:32px;
    }

    .container{
        width:94%;
    }

    .card{
        padding:15px;
    }

    .product-item{
        align-items:flex-start;
    }

    .product-item img{
        width:75px;
        height:75px;
    }

    .product-actions{
        margin-top:8px;
    }
}

</style>
</head>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    signOut,
    onAuthStateChanged,
    setPersistence,
    browserSessionPersistence
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    doc,
    getDoc,
    getDocs,
    setDoc,
    deleteDoc,
    query,
    orderBy,
    limit,
    runTransaction,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
   ===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyA8_4ArKXAdfKWZ5mi5DaT9qiayL3h_Yzw",

    authDomain:
        "janjua-traders.firebaseapp.com",

    projectId:
        "janjua-traders",

    storageBucket:
        "janjua-traders.firebasestorage.app",

    messagingSenderId:
        "154904774188",

    appId:
        "1:154904774188:web:1830f9d533e77dae6a7389"

};


/* =====================================================
   INITIALIZE FIREBASE
   ===================================================== */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =====================================================
   CLOUDINARY
   ===================================================== */

const CLOUDINARY_URL =
    "https://api.cloudinary.com/v1_1/r6brgbd8/image/upload";

const CLOUDINARY_PRESET =
    "janjua_traders";


/* =====================================================
   DOM
   ===================================================== */

const loginSection =
    document.getElementById("loginSection");

const adminSection =
    document.getElementById("adminSection");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const forgotBtn =
    document.getElementById("forgotBtn");

const logoutBtn =
    document.getElementById("logoutBtn");

const eyeBtn =
    document.getElementById("eyeBtn");

const loginMessage =
    document.getElementById("loginMessage");

const saveMessage =
    document.getElementById("saveMessage");

const userInfo =
    document.getElementById("userInfo");

const productName =
    document.getElementById("productName");

const category =
    document.getElementById("category");

const price =
    document.getElementById("price");

const oldPrice =
    document.getElementById("oldPrice");

const deliveryType =
    document.getElementById("deliveryType");

const deliveryCharges =
    document.getElementById("deliveryCharges");

const description =
    document.getElementById("description");

const productImage =
    document.getElementById("productImage");

const imagePreview =
    document.getElementById("imagePreview");

const previewImg =
    document.getElementById("previewImg");

const uploadProgress =
    document.getElementById("uploadProgress");

const progressBar =
    document.getElementById("progressBar");

const ordinaryLink =
    document.getElementById("ordinaryLink");

const supplierLink =
    document.getElementById("supplierLink");

const socialLink =
    document.getElementById("socialLink");

const supplier =
    document.getElementById("supplier");

const saveProductBtn =
    document.getElementById("saveProductBtn");

const productList =
    document.getElementById("productList");

const searchProducts =
    document.getElementById("searchProducts");


/* =====================================================
   MESSAGE
   ===================================================== */

function showMessage(element, text, type){

    element.textContent = text;

    element.className =
        "message " + type;

    element.style.display =
        "block";
}


function hideMessage(element){

    element.style.display =
        "none";

}


/* =====================================================
   FIREBASE ERROR
   ===================================================== */

function getFirebaseErrorMessage(error){

    if(!error){

        return "Unknown Firebase error";

    }

    return (
        "Firebase Error:\n" +
        (error.code || "unknown-code") +
        "\n\n" +
        (error.message || "No error message")
    );

}


/* =====================================================
   PASSWORD SHOW / HIDE
   ===================================================== */

eyeBtn.addEventListener("click", () => {

    if(passwordInput.type === "password"){

        passwordInput.type =
            "text";

        eyeBtn.textContent =
            "🙈";

    }else{

        passwordInput.type =
            "password";

        eyeBtn.textContent =
            "👁️";

    }

});


/* =====================================================
   LOGIN
   ===================================================== */

async function login(){

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;

    hideMessage(loginMessage);

    if(!email){

        showMessage(
            loginMessage,
            "Email درج کریں۔",
            "error"
        );

        return;
    }

    if(!password){

        showMessage(
            loginMessage,
            "Password درج کریں۔",
            "error"
        );

        return;
    }


    loginBtn.disabled =
        true;

    loginBtn.textContent =
        "Logging in...";


    try{

        await setPersistence(
            auth,
            browserSessionPersistence
        );

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        showMessage(
            loginMessage,
            "✅ Login successful",
            "success"
        );


    }catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );

        showMessage(
            loginMessage,
            "❌ " +
            getFirebaseErrorMessage(error),
            "error"
        );

    }finally{

        loginBtn.disabled =
            false;

        loginBtn.textContent =
            "🔑 LOGIN";

    }

}


loginBtn.addEventListener(
    "click",
    login
);


/* =====================================================
   ENTER KEY LOGIN
   ===================================================== */

[emailInput,passwordInput].forEach(
    input => {

        input.addEventListener(
            "keydown",
            event => {

                if(event.key === "Enter"){

                    login();

                }

            }
        );

    }
);


/* =====================================================
   FORGOT PASSWORD
   ===================================================== */

forgotBtn.addEventListener(
    "click",
    async () => {

        const email =
            emailInput.value.trim();

        hideMessage(loginMessage);

        if(!email){

            showMessage(
                loginMessage,
                "پہلے اپنا Admin Email درج کریں۔",
                "error"
            );

            return;
        }


        forgotBtn.disabled =
            true;

        forgotBtn.textContent =
            "Sending...";


        try{

            await sendPasswordResetEmail(
                auth,
                email
            );

            showMessage(
                loginMessage,
                "✅ Password reset email بھیج دی گئی ہے۔ اپنا Gmail Inbox / Spam چیک کریں۔",
                "success"
            );

        }catch(error){

            console.error(
                "RESET ERROR:",
                error
            );

            showMessage(
                loginMessage,
                "❌ " +
                getFirebaseErrorMessage(error),
                "error"
            );

        }finally{

            forgotBtn.disabled =
                false;

            forgotBtn.textContent =
                "📧 Forgot Password";

        }

    }
);


/* =====================================================
   LOGOUT
   ===================================================== */

logoutBtn.addEventListener(
    "click",
    async () => {

        try{

            await signOut(auth);

        }catch(error){

            console.error(error);

        }

    }
);


/* =====================================================
   AUTH STATE
   ===================================================== */

onAuthStateChanged(
    auth,
    user => {

        if(user){

            loginSection.classList.add(
                "hidden"
            );

            adminSection.classList.remove(
                "hidden"
            );

            userInfo.textContent =
                user.email || "Admin";

            loadProducts();

        }else{

            loginSection.classList.remove(
                "hidden"
            );

            adminSection.classList.add(
                "hidden"
            );

            userInfo.textContent =
                "";

        }

    }
);


/* =====================================================
   IMAGE PREVIEW
   ===================================================== */

productImage.addEventListener(
    "change",
    () => {

        const file =
            productImage.files[0];

        if(!file){

            imagePreview.style.display =
                "none";

            previewImg.src =
                "";

            return;
        }


        const allowedTypes = [
            "image/jpeg",
            "image/png",
            "image/webp"
        ];


        if(!allowedTypes.includes(
            file.type
        )){

            productImage.value =
                "";

            showMessage(
                saveMessage,
                "صرف JPG, PNG یا WebP تصویر استعمال کریں۔",
                "error"
            );

            imagePreview.style.display =
                "none";

            return;
        }


        if(file.size > 5 * 1024 * 1024){

            productImage.value =
                "";

            showMessage(
                saveMessage,
                "تصویر 5MB سے زیادہ نہیں ہونی چاہیے۔",
                "error"
            );

            imagePreview.style.display =
                "none";

            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            event => {

                previewImg.src =
                    event.target.result;

                imagePreview.style.display =
                    "block";

            };


        reader.readAsDataURL(file);

    }
);


/* =====================================================
   DELIVERY CHARGES
   ===================================================== */

deliveryType.addEventListener(
    "change",
    () => {

        if(
            deliveryType.value ===
            "Free Delivery"
        ){

            deliveryCharges.value =
                "0";

            deliveryCharges.disabled =
                true;

        }else{

            deliveryCharges.disabled =
                false;

        }

    }
);


/* =====================================================
   INITIAL DELIVERY STATE
   ===================================================== */

deliveryCharges.disabled =
    true;


/* =====================================================
   PRODUCT ID GENERATOR
   ===================================================== */

async function getNextProductId(){

    const counterRef =
        doc(
            db,
            "system",
            "counters"
        );


    const nextNumber =
        await runTransaction(
            db,
            async transaction => {

                const counterSnap =
                    await transaction.get(
                        counterRef
                    );


                let current =
                    0;


                if(counterSnap.exists()){

                    current =
                        Number(
                            counterSnap.data().productCounter
                        ) || 0;

                }


                const next =
                    current + 1;


                transaction.set(
                    counterRef,
                    {
                        productCounter:
                            next,

                        updatedAt:
                            serverTimestamp()
                    },
                    {
                        merge:true
                    }
                );


                return next;

            }
        );


    return (
        "JT.PRODUCT." +
        String(nextNumber).padStart(
            4,
            "0"
        )
    );

}


/* =====================================================
   CLOUDINARY UPLOAD
   ===================================================== */

async function uploadImage(file){

    const formData =
        new FormData();


    formData.append(
        "file",
        file
    );


    formData.append(
        "upload_preset",
        CLOUDINARY_PRESET
    );


    uploadProgress.style.display =
        "block";

    progressBar.style.width =
        "20%";


    const response =
        await fetch(
            CLOUDINARY_URL,
            {
                method:"POST",
                body:formData
            }
        );


    progressBar.style.width =
        "80%";


    const data =
        await response.json();


    if(!response.ok){

        throw new Error(
            data.error?.message ||
            "Cloudinary upload failed"
        );

    }


    progressBar.style.width =
        "100%";


    return data.secure_url;

}


/* =====================================================
   SAVE PRODUCT
   ===================================================== */

saveProductBtn.addEventListener(
    "click",
    saveProduct
);


async function saveProduct(){

    hideMessage(saveMessage);


    if(!productName.value.trim()){

        showMessage(
            saveMessage,
            "Product Name درج کریں۔",
            "error"
        );

        return;
    }


    if(!category.value){

        showMessage(
            saveMessage,
            "Category select کریں۔",
            "error"
        );

        return;
    }


    if(
        !price.value ||
        Number(price.value) <= 0
    ){

        showMessage(
            saveMessage,
            "Selling Price درج کریں۔",
            "error"
        );

        return;
    }


    if(!productImage.files[0]){

        showMessage(
            saveMessage,
            "Product Image منتخب کریں۔",
            "error"
        );

        return;
    }


    if(
        deliveryType.value ===
        "Paid Delivery" &&
        Number(deliveryCharges.value) < 0
    ){

        showMessage(
            saveMessage,
            "Delivery Charges درست درج کریں۔",
            "error"
        );

        return;
    }


    saveProductBtn.disabled =
        true;

    saveProductBtn.textContent =
        "⏳ Saving...";


    try{

        const file =
            productImage.files[0];


        showMessage(
            saveMessage,
            "⏳ Image upload ہو رہی ہے...",
            "info"
        );


        const imageUrl =
            await uploadImage(file);


        showMessage(
            saveMessage,
            "⏳ Product ID بنایا جا رہا ہے...",
            "info"
        );


        const productId =
            await getNextProductId();


        const productData = {

            id:
                productId,

            name:
                productName.value.trim(),

            category:
                category.value,

            price:
                Number(price.value),

            oldPrice:
                Number(oldPrice.value || 0),

            description:
                description.value.trim(),

            image:
                imageUrl,

            deliveryType:
                deliveryType.value,

            deliveryCharges:
                Number(
                    deliveryCharges.value || 0
                ),

            createdAt:
                serverTimestamp()

        };


        const sourceData = {

            productId:
                productId,

            supplier:
                supplier.value || "Other",

            ordinaryLink:
                ordinaryLink.value.trim(),

            supplierLink:
                supplierLink.value.trim(),

            socialLink:
                socialLink.value.trim(),

            createdAt:
                serverTimestamp()

        };


        await setDoc(
            doc(
                db,
                "products",
                productId
            ),
            productData
        );


        await setDoc(
            doc(
                db,
                "productSources",
                productId
            ),
            sourceData
        );


        showMessage(
            saveMessage,
            "✅ Product successfully saved!\n\nProduct ID: " +
            productId,
            "success"
        );


        clearProductForm();

        await loadProducts();


    }catch(error){

        console.error(
            "SAVE PRODUCT ERROR:",
            error
        );


        showMessage(
            saveMessage,
            "❌ Product save نہیں ہوا۔\n\n" +
            (
                error.message ||
                "Unknown error"
            ),
            "error"
        );

    }finally{

        saveProductBtn.disabled =
            false;

        saveProductBtn.textContent =
            "💾 SAVE PRODUCT";


        setTimeout(
            () => {

                uploadProgress.style.display =
                    "none";

                progressBar.style.width =
                    "0%";

            },
            1500
        );

    }

}

/* =====================================================
   LOAD PRODUCTS
   ===================================================== */

let allProducts = [];


async function loadProducts(){

    productList.innerHTML =
        '<div class="empty">Loading products...</div>';


    try{

        const productsRef =
            collection(
                db,
                "products"
            );


        const q =
            query(
                productsRef,
                orderBy(
                    "createdAt",
                    "desc"
                ),
                limit(200)
            );


        const snapshot =
            await getDocs(q);


        allProducts =
            snapshot.docs.map(
                item => ({
                    firestoreId:
                        item.id,

                    ...item.data()
                })
            );


        renderProducts(
            allProducts
        );


    }catch(error){

        console.error(
            "LOAD PRODUCTS ERROR:",
            error
        );


        /*
         If createdAt ordering has a temporary
         index issue, try loading without orderBy.
        */

        try{

            const snapshot =
                await getDocs(
                    collection(
                        db,
                        "products"
                    )
                );


            allProducts =
                snapshot.docs.map(
                    item => ({
                        firestoreId:
                            item.id,

                        ...item.data()
                    })
                );


            allProducts.sort(
                (a,b) => {

                    const aTime =
                        a.createdAt?.seconds ||
                        0;

                    const bTime =
                        b.createdAt?.seconds ||
                        0;

                    return bTime - aTime;

                }
            );


            renderProducts(
                allProducts
            );


        }catch(secondError){

            productList.innerHTML =
                '<div class="empty">Products load نہیں ہو سکے۔</div>';

            console.error(
                secondError
            );

        }

    }

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(value){

    if(value === null ||
       value === undefined){

        return "";

    }


    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   RENDER PRODUCTS
   ===================================================== */

function renderProducts(products){

    if(!products.length){

        productList.innerHTML =
            '<div class="empty">ابھی کوئی Product موجود نہیں۔</div>';

        return;
    }


    productList.innerHTML =
        "";


    products.forEach(
        product => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "product-item";


            const image =
                escapeHtml(
                    product.image || ""
                );


            const name =
                escapeHtml(
                    product.name || ""
                );


            const id =
                escapeHtml(
                    product.id || ""
                );


            const cat =
                escapeHtml(
                    product.category || ""
                );


            const productPrice =
                Number(
                    product.price || 0
                );


            item.innerHTML = `

                <img
                    src="${image}"
                    alt="${name}"
                    loading="lazy"
                    onerror="this.style.display='none'"
                >

                <div class="product-info">

                    <div class="product-name">
                        ${name}
                    </div>

                    <div class="product-id">
                        ${id}
                    </div>

                    <div class="product-price">
                        Rs. ${productPrice.toLocaleString()}
                    </div>

                    <span class="badge">
                        ${cat}
                    </span>

                </div>

                <div class="product-actions">

                    <button
                        type="button"
                        class="copy-btn small-btn"
                        data-copy="${id}"
                    >
                        🔗 Copy Order Link
                    </button>

                    <button
                        type="button"
                        class="danger-btn small-btn"
                        data-delete="${id}"
                    >
                        🗑 Delete
                    </button>

                </div>

            `;


            productList.appendChild(
                item
            );

        }
    );


    productList
        .querySelectorAll(
            "[data-copy]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        copyOrderLink(
                            button.dataset.copy
                        );

                    }
                );

            }
        );


    productList
        .querySelectorAll(
            "[data-delete]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        deleteProduct(
                            button.dataset.delete
                        );

                    }
                );

            }
        );

}


/* =====================================================
   COPY ORDER LINK
   ===================================================== */

async function copyOrderLink(productId){

    const url =
        window.location.origin +
        window.location.pathname
            .replace(
                "Admin.html",
                "order-form.html"
            ) +
        "?Product_ID=" +
        encodeURIComponent(
            productId
        );


    try{

        await navigator.clipboard.writeText(
            url
        );


        alert(
            "✅ Order Link copied!\n\n" +
            url
        );


    }catch(error){

        prompt(
            "Order Link:",
            url
        );

    }

}


/* =====================================================
   DELETE PRODUCT
   ===================================================== */

async function deleteProduct(productId){

    const confirmed =
        confirm(
            "کیا آپ واقعی یہ Product Delete کرنا چاہتے ہیں؟\n\n" +
            productId
        );


    if(!confirmed){

        return;

    }


    try{

        await deleteDoc(
            doc(
                db,
                "products",
                productId
            )
        );


        /*
         Delete matching private source record too.
        */

        try{

            await deleteDoc(
                doc(
                    db,
                    "productSources",
                    productId
                )
            );

        }catch(sourceError){

            console.warn(
                "Source delete warning:",
                sourceError
            );

        }


        alert(
            "✅ Product deleted successfully."
        );


        await loadProducts();


    }catch(error){

        console.error(
            "DELETE ERROR:",
            error
        );


        alert(
            "❌ Delete failed:\n\n" +
            (
                error.message ||
                "Unknown error"
            )
        );

    }

}


/* =====================================================
   SEARCH
   ===================================================== */

searchProducts.addEventListener(
    "input",
    () => {

        const search =
            searchProducts.value
                .trim()
                .toLowerCase();


        if(!search){

            renderProducts(
                allProducts
            );

            return;

        }


        const filtered =
            allProducts.filter(
                product => {

                    const name =
                        String(
                            product.name || ""
                        ).toLowerCase();


                    const id =
                        String(
                            product.id || ""
                        ).toLowerCase();


                    const cat =
                        String(
                            product.category || ""
                        ).toLowerCase();


                    return (
                        name.includes(search) ||
                        id.includes(search) ||
                        cat.includes(search)
                    );

                }
            );


        renderProducts(
            filtered
        );

    }
);
