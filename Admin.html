<style>

*{

body{

/* =========================
   HEADER
========================= */

/* =========================
   MAIN

/* =========================
   CARD
========================= */

========================= */

#loginPanel{

#loginMessage,

/* =========================
   IMAGE
========================= */

.preview img{

/* =========================
   AUTO LINK
========================= */

.auto-link-box input{

========================= */

.small{

.search-box{

/* ==========================================

========================================== */

const firebaseConfig = {

};


/* ==========================================

========================================== */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

/* ==========================================
   CLOUDINARY

========================================== */

/* ==========================================

========================================== */

let allProducts = [];

let uploadedImageUrl = "";


/* ==========================================
   ELEMENTS
========================================== */

const loginPanel =
    document.getElementById("loginPanel");

const adminPanel =
    document.getElementById("adminPanel");

const loginMessage =

const saveMessage =

/* ==========================================
   MESSAGE
========================================== */

function showMessage(element, message, type="success") {

    element.style.display = "block";

    element.innerHTML = message;

    if(type === "error"){

        element.style.background = "#fdecea";

        element.style.color = "#b71c1c";

    }else{

        element.style.background = "#eaf7ef";

        element.style.color = "#176b3a";

    }

}


/* ==========================================
   FIREBASE ERROR TRANSLATION
========================================== */

function firebaseError(error){

    const code = error?.code || "";

    if(code.includes("auth/api-key-not-valid")){

        return `
        <b>Firebase API Key Error</b><br>
        Firebase API key کو reject کر رہا ہے۔<br><br>

        Firebase Console میں Web App کا موجودہ Config درست ہے،
        لیکن Google Cloud میں API Key restriction/check کرنا ضروری ہے۔
        `;

    }

    if(code.includes("auth/invalid-credential")){

        return "Email یا Password غلط ہے۔";

    }

    if(code.includes("auth/invalid-email")){

        return "Email address درست نہیں ہے۔";

    }

    if(code.includes("auth/user-not-found")){

        return "یہ Admin Email Firebase Authentication میں موجود نہیں۔";

    }

    if(code.includes("auth/wrong-password")){

        return "Password غلط ہے۔";

    }

    if(code.includes("auth/too-many-requests")){

        return "کئی بار غلط کوشش ہوئی ہے۔ کچھ دیر بعد دوبارہ کوشش کریں۔";

    }

    if(code.includes("permission-denied")){

        return "Firestore Permission Denied۔ Firebase Rules چیک کریں۔";

    }

    return `
        Error:<br>
        ${error?.message || "Unknown Firebase Error"}
    `;

}


/* ==========================================
   LOGIN
========================================== */

/* ==========================================

onAuthStateChanged(auth, async(user)=>{

/* ==========================================
   AUTOMATIC PRODUCT ID
========================================== */

async function generateProductId(){

    try{

        const counterRef =
            doc(db, "system", "counters");

        const newId =
            await runTransaction(
                db,
                async(transaction)=>{

                    const snap =
                        await transaction.get(counterRef);

                    let current = 0;

                    if(snap.exists()){

                        current =
                            Number(snap.data().productCounter || 0);

                    }

                    const next =
                        current + 1;

                    transaction.set(
                        counterRef,
                        {
                            productCounter: next
                        },
                        {
                            merge:true
                        }
                    );

                    return next;

                }
            );

        const formatted =
            String(newId).padStart(4,"0");

        const productId =
            "JT.PRODUCT." + formatted;

        document.getElementById("productId").value =
            productId;

        generateJanjuaLink();

    }catch(error){

        console.error(error);

        showMessage(
            saveMessage,
            "Product ID بنانے میں مسئلہ: " +
            firebaseError(error),
            "error"
        );

    }

}


/* ==========================================
   JANJUA AUTO LINK
========================================== */

function generateJanjuaLink(){

    const productId =
        document.getElementById("productId").value.trim();

    if(!productId){

        document.getElementById("janjuaLink").value = "";

        return;
    }

    const link =
        WEBSITE_BASE +
        "order-form.html?Product_ID=" +
        encodeURIComponent(productId);

    document.getElementById("janjuaLink").value =
        link;

}


document
.getElementById("productId")
.addEventListener(
    "input",
    generateJanjuaLink
);


/* ==========================================
   COPY JANJUA LINK
========================================== */

window.copyJanjuaLink = async function(){

    const input =
        document.getElementById("janjuaLink");

    const value =
        input.value.trim();

    if(!value){

        alert("پہلے Product ID بننے دیں۔");

        return;
    }

    try{

        await navigator.clipboard.writeText(value);

        alert("JANJUA Link Copy ہو گیا۔");

    }catch(error){

        input.select();

        document.execCommand("copy");

        alert("JANJUA Link Copy ہو گیا۔");

    }

};


/* ==========================================
   IMAGE PREVIEW
========================================== */

document
.getElementById("productImage")
.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        const preview =
            document.getElementById("imagePreview");

        preview.innerHTML = "";

        uploadedImageUrl = "";

        if(!file){

            return;
        }

        if(![
            "image/jpeg",
            "image/png",
            "image/webp"
        ].includes(file.type)){

            alert("صرف JPG, PNG یا WebP تصویر allowed ہے۔");

            this.value = "";

            return;
        }

        if(file.size > 5 * 1024 * 1024){

            alert("Image زیادہ سے زیادہ 5MB ہونی چاہیے۔");

            this.value = "";

            return;
        }

        const reader =
            new FileReader();

        reader.onload = function(e){

            preview.innerHTML =
                `<img src="${e.target.result}" alt="Preview">`;

        };

        reader.readAsDataURL(file);

    }
);


/* ==========================================
   CLOUDINARY UPLOAD
========================================== */

async function uploadToCloudinary(file){

    const formData =
        new FormData();

    formData.append(
        "file",
        file
    );

    formData.append(
        "upload_preset",
        CLOUDINARY_UPLOAD_PRESET
    );

    const response =
        await fetch(
            `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
            {
                method:"POST",
                body:formData
            }
        );

    const data =
        await response.json();

    if(!response.ok || !data.secure_url){

        console.error(data);

        throw new Error(
            data?.error?.message ||
            "Cloudinary upload failed"
        );

    }

    return data.secure_url;

}


/* ==========================================
   SAVE PRODUCT
========================================== */

window.saveProduct = async function(){

    const productId =
        document.getElementById("productId").value.trim();

    const name =
        document.getElementById("productName").value.trim();

    const description =
        document.getElementById("productDescription").value.trim();

    const price =
        Number(
            document.getElementById("productPrice").value
        );

    const oldPrice =
        Number(
            document.getElementById("oldPrice").value || 0
        );

    const deliveryType =
        document.getElementById("deliveryType").value;

    const deliveryCharges =
        Number(
            document.getElementById("deliveryCharges").value || 0
        );

    const supplierLink =
        document.getElementById("supplierLink").value.trim();

    const janjuaLink =
        document.getElementById("janjuaLink").value.trim();

    const socialLink =
        document.getElementById("socialLink").value.trim();

    const imageFile =
        document.getElementById("productImage").files[0];


    /* VALIDATION */

    if(!productId){

        alert("Product ID موجود نہیں۔");

        return;
    }

    if(!name){

        alert("Product Name لکھیں۔");

        return;
    }

    if(!price || price <= 0){

        alert("Product Price درست درج کریں۔");

        return;
    }

    if(!imageFile && !uploadedImageUrl){

        alert("Product Image منتخب کریں۔");

        return;
    }


    saveBtn.disabled = true;

    saveBtn.textContent = "SAVING...";

    try{

        let imageUrl =
            uploadedImageUrl;


        /* IMAGE UPLOAD */

        if(imageFile){

            showMessage(
                saveMessage,
                "Image Cloudinary پر upload ہو رہی ہے..."
            );

            imageUrl =
                await uploadToCloudinary(
                    imageFile
                );

            uploadedImageUrl =
                imageUrl;

        }


        /* PRODUCT DATA */

        const productData = {

            productId: productId,

            name: name,

            description: description,

            price: price,

            oldPrice: oldPrice,

            deliveryType: deliveryType,

            deliveryCharges: deliveryCharges,

            image: imageUrl,

            janjuaLink: janjuaLink,

            socialLink: socialLink,

            updatedAt: serverTimestamp()

        };


        /* SAVE PUBLIC PRODUCT */

        await setDoc(

            doc(
                db,
                "products",
                productId
            ),

            productData

        );


        /* SAVE PRIVATE SOURCE DATA */

        await setDoc(

            doc(
                db,
                "productSources",
                productId
            ),

            {

                productId: productId,

                supplierLink: supplierLink,

                socialLink: socialLink,

                updatedAt: serverTimestamp()

            }

        );


        showMessage(

            saveMessage,

            `
            <b>✅ Product Successfully Saved</b><br><br>

            Product ID: ${productId}<br>

            JANJUA Link:<br>

            <span dir="ltr">
            ${janjuaLink}
            </span>
            `

        );


        await loadProducts();

        /* NEW ID */

        await generateProductId();


        /* CLEAR FIELDS EXCEPT ID */

        document.getElementById(
            "productName"
        ).value = "";

        document.getElementById(
            "productDescription"
        ).value = "";

        document.getElementById(
            "productPrice"
        ).value = "";

        document.getElementById(
            "oldPrice"
        ).value = "";

        document.getElementById(
            "deliveryCharges"
        ).value = "0";

        document.getElementById(
            "supplierLink"
        ).value = "";

        document.getElementById(
            "socialLink"
        ).value = "";

        document.getElementById(
            "productImage"
        ).value = "";

        document.getElementById(
            "imagePreview"
        ).innerHTML = "";

        uploadedImageUrl = "";


    }catch(error){

        console.error(error);

        showMessage(

            saveMessage,

            firebaseError(error),

            "error"

        );

    }finally{

        saveBtn.disabled = false;

        saveBtn.textContent = "SAVE PRODUCT";

    }

};


/* ==========================================
   LOAD PRODUCTS
========================================== */

async function loadProducts(){

    const list =
        document.getElementById("productList");

    list.innerHTML =
        `<div class="loading">Loading Products...</div>`;

    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "products"
                )
            );

        allProducts = [];

        snapshot.forEach(
            docSnap=>{

                allProducts.push({

                    id:docSnap.id,

                    ...docSnap.data()

                });

            }
        );


        allProducts.sort(
            (a,b)=>
                String(b.productId || b.id)
                .localeCompare(
                    String(a.productId || a.id)
                )
        );


        renderProducts(
            allProducts
        );


    }catch(error){

        console.error(error);

        list.innerHTML =
            `
            <div style="color:#b71c1c;">
                Products load نہیں ہو سکے۔<br>
                ${firebaseError(error)}
            </div>
            `;

    }

}


/* ==========================================
   RENDER PRODUCTS
========================================== */

function renderProducts(products){

    const list =
        document.getElementById("productList");

    if(!products.length){

        list.innerHTML =
            `
            <div class="loading">
                کوئی Product نہیں ملا۔
            </div>
            `;

        return;
    }


    list.innerHTML =
        products.map(
            product=>{

                const image =
                    product.image ||
                    "https://via.placeholder.com/200";

                const supplier =
                    product.supplierLink ||
                    "";


                return `

                <div class="product-item">

                    <div class="product-flex">

                        <img
                            src="${escapeHtml(image)}"
                            alt="${escapeHtml(product.name || "")}"
                        >

                        <div class="product-info">

                            <h3>
                                ${escapeHtml(product.name || "No Name")}
                            </h3>

                            <div class="small">
                                <b>Product ID:</b>
                                ${escapeHtml(product.productId || product.id)}
                            </div>

                            <div class="small">
                                <b>Price:</b>
                                Rs. ${Number(product.price || 0).toLocaleString()}
                            </div>

                            <div class="small">
                                <b>Delivery:</b>
                                ${product.deliveryType === "free"
                                    ? "Free Delivery"
                                    : "Paid Delivery — Rs. " +
                                      Number(product.deliveryCharges || 0).toLocaleString()
                                }
                            </div>

                            ${
                                supplier
                                ?
                                `
                                <div class="small">
                                    <b>Supplier Link:</b><br>
                                    <span dir="ltr">
                                    ${escapeHtml(supplier)}
                                    </span>
                                </div>
                                `
                                :
                                ""
                            }

                            <div class="button-row">

                                <button
                                    class="btn-gold"
                                    onclick="copyProductLink('${encodeURIComponent(product.janjuaLink || "")}')"
                                >
                                    COPY JANJUA LINK
                                </button>

                                <button
                                    class="btn-danger"
                                    onclick="deleteProduct('${encodeURIComponent(product.id)}')"
                                >
                                    DELETE
                                </button>

                            </div>

                        </div>

                    </div>

                </div>

                `;

            }
        ).join("");

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ==========================================
   COPY PRODUCT LINK
========================================== */

window.copyProductLink =
async function(encodedLink){

    const link =
        decodeURIComponent(encodedLink);

    if(!link){

        alert("Link موجود نہیں۔");

        return;
    }

    try{

        await navigator.clipboard.writeText(link);

        alert("JANJUA Link Copy ہو گیا۔");

    }catch(error){

        alert(link);

    }

};


/* ==========================================
   SEARCH
========================================== */

window.searchProducts = function(){

    const query =
        document
        .getElementById("searchProduct")
        .value
        .trim()
        .toLowerCase();


    if(!query){

        renderProducts(
            allProducts
        );

        return;

    }


    const filtered =
        allProducts.filter(
            product=>{

                const name =
                    String(
                        product.name || ""
                    ).toLowerCase();

                const id =
                    String(
                        product.productId ||
                        product.id ||
                        ""
                    ).toLowerCase();

                return (
                    name.includes(query) ||
                    id.includes(query)
                );

            }
        );


    renderProducts(
        filtered
    );

};


/* ==========================================
   DELETE PRODUCT
========================================== */

window.deleteProduct =
async function(encodedId){

    const productId =
        decodeURIComponent(encodedId);

    const confirmDelete =
        confirm(
            `کیا آپ واقعی Product ${productId} Delete کرنا چاہتے ہیں؟`
        );

    if(!confirmDelete){

        return;
    }


    try{

        await deleteDoc(
            doc(
                db,
                "products",
                productId
            )
        );


        await deleteDoc(
            doc(
                db,
                "productSources",
                productId
            )
        );


        alert(
            "Product Firestore سے Delete ہو گیا۔"
        );


        await loadProducts();


    }catch(error){

        console.error(error);

        alert(
            firebaseError(error)
        );

    }

};
