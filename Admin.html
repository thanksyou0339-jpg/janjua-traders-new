<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JANJUA - Admin Panel</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Nastaliq Urdu",sans-serif;
  background:#f4f7f5;
  color:#183b2a;
}

.hidden{
  display:none !important;
}

.login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,#063b27,#0b5b3b,#d6ad48);
}

.login-box{
  width:100%;
  max-width:420px;
  background:white;
  border-radius:22px;
  padding:30px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
  text-align:center;
}

.logo{
  font-size:42px;
  font-weight:900;
  letter-spacing:8px;
  color:#07552f;
}

.login-title{
  margin-top:5px;
  font-size:18px;
  font-weight:bold;
  color:#a37a1e;
}

.input-group{
  text-align:right;
  margin-top:18px;
}

.input-group label{
  display:block;
  font-weight:bold;
  margin-bottom:7px;
}

input,textarea,select{
  width:100%;
  padding:13px;
  border:1px solid #ccd8d1;
  border-radius:10px;
  font-size:15px;
  outline:none;
  background:white;
}

input:focus,textarea:focus,select:focus{
  border-color:#0b6b43;
  box-shadow:0 0 0 3px rgba(11,107,67,.1);
}

.password-box{
  position:relative;
}

.password-box input{
  padding-left:48px;
}

.show-pass{
  position:absolute;
  left:12px;
  top:11px;
  cursor:pointer;
  font-size:20px;
}

.forgot{
  display:block;
  margin-top:14px;
  color:#0a6540;
  font-weight:bold;
  cursor:pointer;
  text-decoration:underline;
}

button{
  border:0;
  border-radius:10px;
  padding:13px 18px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.login-btn{
  width:100%;
  margin-top:20px;
  background:#07552f;
  color:white;
}

.message{
  margin-top:15px;
  padding:10px;
  border-radius:8px;
  display:none;
}

.error{
  background:#ffe8e8;
  color:#a40000;
}

.success{
  background:#e5f8ed;
  color:#07552f;
}

.admin-header{
  background:#063b27;
  color:white;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}

.admin-logo{
  font-size:28px;
  font-weight:900;
  letter-spacing:5px;
}

.admin-subtitle{
  font-size:13px;
  color:#f2d889;
  margin-top:3px;
}

.logout-btn{
  background:#b98b2e;
  color:white;
}

.container{
  max-width:1100px;
  margin:25px auto;
  padding:0 15px;
}

.card{
  background:white;
  border-radius:18px;
  padding:22px;
  margin-bottom:22px;
  box-shadow:0 5px 20px rgba(0,0,0,.07);
}

.card h2{
  margin-top:0;
  color:#07552f;
  border-bottom:2px solid #e4d39c;
  padding-bottom:10px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.full{
  grid-column:1/-1;
}

.save-btn{
  width:100%;
  background:#07552f;
  color:white;
  margin-top:10px;
}

.preview{
  text-align:center;
  margin-top:15px;
}

.preview img{
  max-width:220px;
  max-height:220px;
  border-radius:15px;
  object-fit:contain;
  box-shadow:0 5px 18px rgba(0,0,0,.12);
}

.product-item{
  border:1px solid #dce7e0;
  border-radius:15px;
  padding:15px;
  margin-top:15px;
  background:#fbfdfc;
}

.product-top{
  display:flex;
  gap:15px;
  align-items:center;
}

.product-top img{
  width:90px;
  height:90px;
  object-fit:contain;
  border-radius:10px;
  background:white;
}

.product-info{
  flex:1;
}

.product-name{
  font-weight:bold;
  font-size:18px;
}

.product-id{
  font-size:13px;
  color:#666;
  margin-top:4px;
  direction:ltr;
  text-align:right;
}

.price{
  color:#07552f;
  font-weight:bold;
  margin-top:5px;
}

.delivery-info{
  margin-top:7px;
  font-weight:bold;
}

.links{
  margin-top:12px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.links a{
  display:inline-block;
  padding:8px 10px;
  background:#edf5f0;
  color:#07552f;
  border-radius:8px;
  text-decoration:none;
  font-size:13px;
  direction:ltr;
}

.action-row{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.copy-btn{
  background:#b98b2e;
  color:white;
}

.delete-btn{
  background:#b32626;
  color:white;
}

.own-link{
  width:100%;
  margin-top:10px;
  direction:ltr;
  text-align:left;
}

.small-note{
  font-size:13px;
  color:#666;
  margin-top:7px;
}

@media(max-width:700px){
  .grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .admin-header{
    align-items:flex-start;
  }

  .product-top{
    align-items:flex-start;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-screen">

  <div class="login-box">

    <div class="logo">JANJUA</div>
    <div class="login-title">ADMIN PANEL</div>

    <div class="input-group">
      <label>یوزر نیم / ای میل</label>
      <input
        type="email"
        id="loginEmail"
        placeholder="Admin Email"
        autocomplete="username"
        dir="ltr">
    </div>

    <div class="input-group">
      <label>پاس ورڈ</label>

      <div class="password-box">
        <input
          type="password"
          id="loginPassword"
          placeholder="Password"
          autocomplete="current-password"
          dir="ltr">

        <span
          class="show-pass"
          id="showPassword"
          title="Show Password">👁️</span>
      </div>
    </div>

    <span id="forgotPassword" class="forgot">
      Forgot Password?
    </span>

    <button id="loginBtn" class="login-btn">
      LOGIN
    </button>

    <div id="loginMessage" class="message"></div>

  </div>
</div>


<!-- ADMIN PANEL -->
<div id="adminPanel" class="hidden">

  <header class="admin-header">

    <div>
      <div class="admin-logo">JANJUA</div>
      <div class="admin-subtitle">
        DIGITAL MARKETING ONLINE PLATFORM — ADMIN PANEL
      </div>
    </div>

    <button id="logoutBtn" class="logout-btn">
      Logout
    </button>

  </header>


  <main class="container">

    <!-- PRODUCT -->
    <section class="card">

      <h2>نیا پروڈکٹ شامل کریں</h2>

      <div class="grid">

        <div>
          <label>Product ID</label>
          <input
            id="productId"
            placeholder="مثلاً JT-PRODUCT-001"
            dir="ltr">
        </div>

        <div>
          <label>Product Name</label>
          <input
            id="productName"
            placeholder="پروڈکٹ کا نام">
        </div>

        <div>
          <label>Category</label>
          <input
            id="category"
            placeholder="Shoes / Beauty / Clothes">
        </div>

        <div>
          <label>Selling Price</label>
          <input
            id="price"
            type="number"
            min="0"
            placeholder="2000">
        </div>

        <div>
          <label>Old Price</label>
          <input
            id="oldPrice"
            type="number"
            min="0"
            placeholder="2500">
        </div>

        <div>
          <label>Delivery Type</label>
          <select id="deliveryType">
            <option value="free">Free Delivery</option>
            <option value="paid">Paid Delivery</option>
          </select>
        </div>

        <div id="deliveryChargesBox" class="full hidden">

          <label>Delivery Charges</label>

          <input
            id="deliveryCharges"
            type="number"
            min="0"
            value="0"
            placeholder="مثلاً 250">

          <div class="small-note">
            یہ رقم Customer کو Total Amount میں بھی دکھائی جائے گی۔
          </div>

        </div>

        <div class="full">
          <label>Description</label>
          <textarea
            id="description"
            rows="4"
            placeholder="Product details"></textarea>
        </div>

        <div class="full">
          <label>Product Image</label>

          <input
            type="file"
            id="imageFile"
            accept="image/jpeg,image/png,image/webp">

          <div class="small-note">
            JPG / PNG / WebP — زیادہ سے زیادہ 5MB
          </div>

          <div id="preview" class="preview"></div>
        </div>

        <div class="full">
          <label>ہمارا Browser / Product Link</label>
          <input
            id="ordinaryLink"
            placeholder="https://..."
            dir="ltr">
        </div>

        <div class="full">
          <label>Original Markaz / Daraz Link</label>
          <input
            id="supplierLink"
            placeholder="https://..."
            dir="ltr">
        </div>

        <div class="full">
          <label>TikTok / Facebook Link</label>
          <input
            id="socialLink"
            placeholder="https://..."
            dir="ltr">
        </div>

        <div class="full">
          <label>Supplier</label>
          <input
            id="supplier"
            placeholder="Markaz / Daraz / Other">
        </div>

      </div>

      <button id="saveProductBtn" class="save-btn">
        SAVE PRODUCT
      </button>

      <div id="adminMessage" class="message"></div>

    </section>


    <!-- PRODUCTS -->
    <section class="card">

      <h2>Saved Products</h2>

      <div id="productsList">
        Loading...
      </div>

    </section>

  </main>

</div>


<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged,
  sendPasswordResetEmail,
  browserSessionPersistence,
  setPersistence
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  setDoc,
  doc,
  getDocs,
  getDoc,
  deleteDoc
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyA8_4ArKXAdfKWZ5mi5DaT9qiayL3h_Yzw",
  authDomain: "janjua-traders.firebaseapp.com",
  projectId: "janjua-traders",
  storageBucket: "janjua-traders.firebasestorage.app",
  messagingSenderId: "154904774188",
  appId: "1:154904774188:web:1830f9d533e77dae6a7389"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


await setPersistence(auth, browserSessionPersistence);


const loginScreen = document.getElementById("loginScreen");
const adminPanel = document.getElementById("adminPanel");

const loginEmail = document.getElementById("loginEmail");
const loginPassword = document.getElementById("loginPassword");

const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const forgotPassword = document.getElementById("forgotPassword");

const loginMessage = document.getElementById("loginMessage");
const adminMessage = document.getElementById("adminMessage");

const deliveryType = document.getElementById("deliveryType");
const deliveryChargesBox = document.getElementById("deliveryChargesBox");

const imageFile = document.getElementById("imageFile");
const preview = document.getElementById("preview");


function showMessage(element, text, type="success"){
  element.textContent = text;
  element.className = "message " + type;
  element.style.display = "block";
}


function clearMessage(element){
  element.style.display = "none";
}


deliveryType.addEventListener("change", () => {

  if(deliveryType.value === "paid"){
    deliveryChargesBox.classList.remove("hidden");
  }else{
    deliveryChargesBox.classList.add("hidden");
    document.getElementById("deliveryCharges").value = "0";
  }

});


document.getElementById("showPassword").addEventListener("click", () => {

  if(loginPassword.type === "password"){
    loginPassword.type = "text";
  }else{
    loginPassword.type = "password";
  }

});


loginBtn.addEventListener("click", async () => {

  clearMessage(loginMessage);

  const email = loginEmail.value.trim();
  const password = loginPassword.value;

  if(!email || !password){
    showMessage(
      loginMessage,
      "براہِ کرم Username/Email اور Password درج کریں۔",
      "error"
    );
    return;
  }

  try{

    loginBtn.disabled = true;
    loginBtn.textContent = "LOGIN...";

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(error){

    let msg = "Login نہیں ہو سکا۔";

    if(
      error.code === "auth/invalid-credential" ||
      error.code === "auth/wrong-password" ||
      error.code === "auth/user-not-found"
    ){
      msg = "Username/Email یا Password غلط ہے۔";
    }

    showMessage(loginMessage,msg,"error");

  }finally{

    loginBtn.disabled = false;
    loginBtn.textContent = "LOGIN";

  }

});


forgotPassword.addEventListener("click", async () => {

  clearMessage(loginMessage);

  const email = loginEmail.value.trim();

  if(!email){

    showMessage(
      loginMessage,
      "پہلے Username / Admin Email درج کریں۔",
      "error"
    );

    loginEmail.focus();
    return;
  }

  try{

    await sendPasswordResetEmail(auth,email);

    showMessage(
      loginMessage,
      "Password Reset Link آپ کے Admin Email پر بھیج دیا گیا ہے۔ Gmail Inbox اور Spam/Junk بھی چیک کریں۔",
      "success"
    );

  }catch(error){

    showMessage(
      loginMessage,
      "Password Reset Email نہیں بھیجی جا سکی۔ Email درست چیک کریں۔",
      "error"
    );

  }

});


logoutBtn.addEventListener("click", async () => {

  await signOut(auth);

});


onAuthStateChanged(auth, user => {

  if(user){

    loginScreen.classList.add("hidden");
    adminPanel.classList.remove("hidden");

    loadProducts();

  }else{

    adminPanel.classList.add("hidden");
    loginScreen.classList.remove("hidden");

  }

});


imageFile.addEventListener("change", () => {

  const file = imageFile.files[0];

  if(!file){
    preview.innerHTML = "";
    return;
  }

  if(file.size > 5 * 1024 * 1024){

    showMessage(
      adminMessage,
      "Image 5MB سے زیادہ نہیں ہونی چاہیے۔",
      "error"
    );

    imageFile.value = "";
    preview.innerHTML = "";
    return;
  }

  const url = URL.createObjectURL(file);

  preview.innerHTML =
    `<img src="${url}" alt="Preview">`;

});


async function uploadImage(file){

  if(!file){
    throw new Error("براہِ کرم Product Image منتخب کریں۔");
  }

  const formData = new FormData();

  formData.append("file",file);
  formData.append(
    "upload_preset",
    "janjua_traders"
  );


  const response = await fetch(
    "https://api.cloudinary.com/v1_1/r6brgbd8/image/upload",
    {
      method:"POST",
      body:formData
    }
  );


  if(!response.ok){
    throw new Error("Image upload failed.");
  }


  const data = await response.json();

  if(!data.secure_url){
    throw new Error("Image URL نہیں ملی۔");
  }

  return data.secure_url;
}


document.getElementById("saveProductBtn").addEventListener(
  "click",
  async () => {

    clearMessage(adminMessage);

    try{

      const productId =
        document.getElementById("productId").value.trim();

      const name =
        document.getElementById("productName").value.trim();

      const category =
        document.getElementById("category").value.trim();

      const price =
        Number(document.getElementById("price").value || 0);

      const oldPrice =
        Number(document.getElementById("oldPrice").value || 0);

      const description =
        document.getElementById("description").value.trim();

      const ordinaryLink =
        document.getElementById("ordinaryLink").value.trim();

      const supplierLink =
        document.getElementById("supplierLink").value.trim();

      const socialLink =
        document.getElementById("socialLink").value.trim();

      const supplier =
        document.getElementById("supplier").value.trim();

      const deliveryMode =
        deliveryType.value;

      const deliveryCharges =
        deliveryMode === "paid"
        ? Number(document.getElementById("deliveryCharges").value || 0)
        : 0;


      if(!productId){
        throw new Error("Product ID لازمی ہے۔");
      }

      if(!name){
        throw new Error("Product Name لازمی ہے۔");
      }

      if(price <= 0){
        throw new Error("Selling Price درست درج کریں۔");
      }

      if(deliveryMode === "paid" && deliveryCharges <= 0){
        throw new Error("Paid Delivery کے لیے Delivery Charges درج کریں۔");
      }


      const file = imageFile.files[0];

      if(!file){
        throw new Error("Product Image منتخب کریں۔");
      }


      const saveButton =
        document.getElementById("saveProductBtn");

      saveButton.disabled = true;
      saveButton.textContent = "Saving...";


      const imageUrl = await uploadImage(file);


      await addDoc(collection(db,"products"),{

        id:productId,
        name:name,
        category:category,
        price:price,
        oldPrice:oldPrice,
        description:description,
        image:imageUrl,

        deliveryType:deliveryMode,
        deliveryCharges:deliveryCharges,

        createdAt:new Date().toISOString()

      });


      await setDoc(
        doc(db,"productSources",productId),
        {

          productId:productId,
          supplier:supplier,
          ordinaryLink:ordinaryLink,
          supplierLink:supplierLink,
          socialLink:socialLink,

          createdAt:new Date().toISOString()

        }
      );


      showMessage(
        adminMessage,
        "Product کامیابی سے Save ہو گیا۔",
        "success"
      );


      document.getElementById("productId").value = "";
      document.getElementById("productName").value = "";
      document.getElementById("category").value = "";
      document.getElementById("price").value = "";
      document.getElementById("oldPrice").value = "";
      document.getElementById("description").value = "";
      document.getElementById("ordinaryLink").value = "";
      document.getElementById("supplierLink").value = "";
      document.getElementById("socialLink").value = "";
      document.getElementById("supplier").value = "";

      imageFile.value = "";
      preview.innerHTML = "";

      deliveryType.value = "free";
      deliveryChargesBox.classList.add("hidden");
      document.getElementById("deliveryCharges").value = "0";


      await loadProducts();


    }catch(error){

      console.error(error);

      showMessage(
        adminMessage,
        error.message || "Product Save نہیں ہو سکا۔",
        "error"
      );

    }finally{

      const saveButton =
        document.getElementById("saveProductBtn");

      saveButton.disabled = false;
      saveButton.textContent = "SAVE PRODUCT";

    }

  }
);


async function loadProducts(){

  const list =
    document.getElementById("productsList");

  list.innerHTML = "Loading...";


  try{

    const snapshot =
      await getDocs(collection(db,"products"));


    if(snapshot.empty){

      list.innerHTML =
        "<p>ابھی کوئی Product موجود نہیں۔</p>";

      return;
    }


    list.innerHTML = "";


    for(const item of snapshot.docs){

      const product = item.data();

      const productId =
        product.id || item.id;


      const sourceSnap =
        await getDoc(
          doc(db,"productSources",productId)
        );


      const source =
        sourceSnap.exists()
        ? sourceSnap.data()
        : {};


      const deliveryText =
        product.deliveryType === "paid"
        ? `Paid Delivery — Rs. ${Number(product.deliveryCharges || 0).toLocaleString()}`
        : "Free Delivery";


      const ownUrl =
        new URL(
          "order-form.html",
          window.location.href
        );


      ownUrl.searchParams.set(
        "Product_ID",
        productId
      );


      const wrapper =
        document.createElement("div");

      wrapper.className = "product-item";


      wrapper.innerHTML = `

        <div class="product-top">

          <img
            src="${escapeHtml(product.image || "")}"
            alt="Product">

          <div class="product-info">

            <div class="product-name">
              ${escapeHtml(product.name || "")}
            </div>

            <div class="product-id">
              Product ID: ${escapeHtml(productId)}
            </div>

            <div class="price">
              Selling Price:
              Rs. ${Number(product.price || 0).toLocaleString()}
            </div>

            <div class="delivery-info">
              ${deliveryText}
            </div>

          </div>

        </div>


        <div class="links">

          ${
            source.ordinaryLink
            ?
            `<a href="${escapeAttribute(source.ordinaryLink)}"
                target="_blank">
                ہمارا Link
             </a>`
            :""
          }

          ${
            source.supplierLink
            ?
            `<a href="${escapeAttribute(source.supplierLink)}"
                target="_blank">
                Original Source
             </a>`
            :""
          }

          ${
            source.socialLink
            ?
            `<a href="${escapeAttribute(source.socialLink)}"
                target="_blank">
                Social Link
             </a>`
            :""
          }

        </div>


        <input
          class="own-link"
          value="${escapeAttribute(ownUrl.toString())}"
          readonly
          dir="ltr">


        <div class="action-row">

          <button class="copy-btn">
            Copy Our Link
          </button>

          <button class="delete-btn">
            Delete
          </button>

        </div>
      `;


      wrapper
        .querySelector(".copy-btn")
        .addEventListener("click", async () => {

          try{

            await navigator.clipboard.writeText(
              ownUrl.toString()
            );

            alert("آپ کا Product Link Copy ہو گیا ہے۔");

          }catch(e){

            alert(
              "Link Copy نہیں ہو سکا۔ اوپر والا Link manually copy کریں۔"
            );

          }

        });


      wrapper
        .querySelector(".delete-btn")
        .addEventListener("click", async () => {

          const yes =
            confirm(
              "کیا آپ واقعی یہ Product Delete کرنا چاہتے ہیں؟"
            );

          if(!yes) return;


          await deleteDoc(
            doc(db,"products",item.id)
          );


          try{

            await deleteDoc(
              doc(db,"productSources",productId)
            );

          }catch(e){
            console.log(e);
          }


          await loadProducts();

        });


      list.appendChild(wrapper);

    }


  }catch(error){

    console.error(error);

    list.innerHTML =
      "<p style='color:red'>Products load نہیں ہو سکے۔</p>";

  }

}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttribute(value){
  return escapeHtml(value);
}
