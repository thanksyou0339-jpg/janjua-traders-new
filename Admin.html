<!DOCTYPE html>

<head>

<title>JANJUA — Admin Panel</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f5f8;
    color:#17202a;
}

.header{
    background:#0b3d2e;
    color:white;
    padding:22px 15px;
    text-align:center;
    position:relative;
    overflow:hidden;
}

.logo{
    position:relative;
    display:inline-block;
    font-size:42px;
    font-weight:900;
    letter-spacing:5px;
    color:#f4c542;
}

.subtitle{
    margin-top:5px;
    font-size:14px;
    color:#fff;
    letter-spacing:2px;
}

.orbit{
    position:absolute;
    width:125px;
    height:125px;
    border:1px solid rgba(244,197,66,.45);
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) rotate(-20deg);
    pointer-events:none;
}

.satellite{
    position:absolute;
    width:12px;
    height:12px;
    background:#f4c542;
    border-radius:50%;
    top:-6px;
    left:50%;
    box-shadow:0 0 12px #f4c542;
    animation:orbit 4s linear infinite;
}

@keyframes orbit{
    from{
        transform:rotate(0deg) translateX(62px) rotate(0deg);
    }
    to{
        transform:rotate(360deg) translateX(62px) rotate(-360deg);
    }
}

.container{
    max-width:1100px;
    margin:25px auto;
    padding:0 15px;
}

.card{
    background:white;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.card h2{
    margin-top:0;
    color:#0b3d2e;
}

label{
    display:block;
    font-weight:bold;
    margin:14px 0 7px;
}

input,
select,
textarea{
    width:100%;
    padding:13px;
    border:1px solid #d5dadd;
    border-radius:9px;
    font-size:15px;
    outline:none;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#0b3d2e;
}

textarea{
    min-height:100px;
    resize:vertical;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.btn{
    border:0;
    border-radius:9px;
    padding:13px 18px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

.btn-primary{
    background:#0b3d2e;
    color:white;
}

.btn-gold{
    background:#f4c542;
    color:#17202a;
}

.btn-danger{
    background:#c0392b;
    color:white;
}

.btn-copy{
    background:#1769aa;
    color:white;
}

.btn:hover{
    opacity:.9;
}

.button-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:20px;
}

.status{
    padding:12px;
    border-radius:8px;
    margin-top:15px;
    display:none;
    font-weight:bold;
}

.success{
    display:block;
    background:#dff5e9;
    color:#176b3a;
}

.error{
    display:block;
    background:#fde4e2;
    color:#a93226;
}

.login-box{
    max-width:450px;
    margin:50px auto;
}

.password-wrap{
    position:relative;
}

.password-wrap input{
    padding-left:50px;
}

.eye{
    position:absolute;
    left:12px;
    top:10px;
    background:none;
    border:0;
    cursor:pointer;
    font-size:20px;
}

.auto-link-box{
    background:#eef7f3;
    border:2px solid #0b3d2e;
    padding:15px;
    border-radius:12px;
    margin-top:20px;
}

.auto-link-title{

    font-weight:bold;

    margin-bottom:8px;
}

.auto-link{
    direction:ltr;
    text-align:left;
    background:white;
    padding:12px;
    border-radius:8px;
    word-break:break-all;
    border:1px solid #cfd8d4;

}

.product{
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    margin-top:15px;
    background:#fff;
}

.product-top{

}

.product img{

    height:110px;
    object-fit:cover;

}

.product-info{
    flex:1;
}

.product-name{
    font-size:19px;
    font-weight:bold;
    margin-bottom:8px;
}

.product-id{
    font-family:monospace;
    color:#1769aa;
    font-weight:bold;
}

.price{
    color:#0b3d2e;
    font-weight:bold;
    font-size:18px;
    margin-top:7px;
}

.link-row{

    padding:10px;

    border-radius:8px;
}

.link-label{

    margin-bottom:5px;

.small-link{

    word-break:break-all;
    font-size:13px;
}

.hidden{

}

.logout{

}

.preview{

@media(max-width:700px){

    .product-top{

    }

    .product img{
        width:100%;

    }

</style>

<script type="module">

import {

} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    getDoc,
    setDoc,
    deleteDoc,
    query,
    orderBy,
    runTransaction
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyA8_4ArKXAdfKWZ5mi5Da5T9qiayL3h_Yzw",

    authDomain:
    "janjua-traders.firebaseapp.com",

    projectId:
    "janjua-traders",

    storageBucket:
    "janjua-traders.firebasestorage.app",

    messagingSenderId:
    "154904774188",

    appId:
    "1:154904774188:web:1830f9d533e77dae6a7389"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================
   CLOUDINARY
========================= */

const CLOUDINARY_URL =
"https://api.cloudinary.com/v1_1/r6brgbd8/image/upload";

const CLOUDINARY_PRESET =
"janjua_traders";


/* =========================
   WEBSITE
========================= */

const WEBSITE_BASE =
"https://thanksyou0339-jpg.github.io/janjua-traders-new/";


/* =========================
   ELEMENTS
========================= */

const loginSection =
document.getElementById("loginSection");

const adminSection =
document.getElementById("adminSection");

const loginEmail =
document.getElementById("loginEmail");

const loginPassword =
document.getElementById("loginPassword");

const loginBtn =
document.getElementById("loginBtn");

const forgotBtn =
document.getElementById("forgotBtn");

const eyeBtn =
document.getElementById("eyeBtn");

const logoutBtn =
document.getElementById("logoutBtn");

const loginStatus =
document.getElementById("loginStatus");

const saveStatus =
document.getElementById("saveStatus");

const saveBtn =
document.getElementById("saveBtn");

const clearBtn =
document.getElementById("clearBtn");

const productsList =
document.getElementById("productsList");

const searchInput =

const imageInput =
document.getElementById("productImage");

const imagePreview =

const generatedLinkBox =

const generatedLink =
document.getElementById("generatedLink");

const copyGeneratedLinkBtn =
document.getElementById("copyGeneratedLinkBtn");


/* =========================
   HELPERS
========================= */

function showStatus(element, message, type){

    element.textContent = message;

    element.className =
        "status " + type;

}


function escapeHTML(value){

    if(value === undefined || value === null){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   PERSISTENCE
========================= */

await setPersistence(
    auth,
    browserSessionPersistence
);


/* =========================
   LOGIN
========================= */

loginBtn.addEventListener(
    "click",
    async () => {

        const email =
            loginEmail.value.trim();

        const password =
            loginPassword.value;

        if(!email || !password){

            showStatus(
                loginStatus,
                "براہ کرم Email اور Password درج کریں۔",
                "error"
            );

            return;
        }

        loginBtn.disabled = true;

        loginBtn.textContent =
            "⏳ LOGGING IN...";

        try{

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

            showStatus(
                loginStatus,
                "Login کامیاب ہو گیا۔",
                "success"
            );

        }catch(error){

            console.error(error);

            showStatus(
                loginStatus,
                "Login Failed: " + error.message,
                "error"
            );

        }finally{

            loginBtn.disabled = false;

            loginBtn.textContent =
                "🔐 LOGIN";

        }

    }
);


/* =========================
   PASSWORD EYE
========================= */

eyeBtn.addEventListener(
    "click",
    () => {

        if(loginPassword.type === "password"){

            loginPassword.type =
                "text";

            eyeBtn.textContent =
                "🙈";

        }else{

            loginPassword.type =
                "password";

            eyeBtn.textContent =
                "👁️";

        }

    }
);


/* =========================
   FORGOT PASSWORD
========================= */

forgotBtn.addEventListener(
    "click",
    async () => {

        const email =
            loginEmail.value.trim();

        if(!email){

            showStatus(
                loginStatus,
                "پہلے اپنا Admin Email لکھیں۔",
                "error"
            );

            return;
        }

        try{

            await sendPasswordResetEmail(
                auth,
                email
            );

            showStatus(
                loginStatus,
                "Password reset email بھیج دی گئی ہے۔ Gmail چیک کریں۔",
                "success"
            );

        }catch(error){

            console.error(error);

            showStatus(
                loginStatus,
                "Reset Failed: " + error.message,
                "error"
            );

        }

    }
);


/* =========================
   LOGOUT
========================= */

logoutBtn.addEventListener(
    "click",
    async () => {

        await signOut(auth);

    }
);


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
    auth,
    async (user) => {

        if(user){

            loginSection.classList.add(
                "hidden"
            );

            adminSection.classList.remove(
                "hidden"
            );

            await loadProducts();

        }else{

            loginSection.classList.remove(
                "hidden"
            );

            adminSection.classList.add(
                "hidden"
            );

        }

    }
);


/* =========================
   IMAGE PREVIEW
========================= */

imageInput.addEventListener(
    "change",
    () => {

        const file =
            imageInput.files[0];

        if(!file){

            imagePreview.style.display =
                "none";

            return;
        }

        if(file.size > 5 * 1024 * 1024){

            showStatus(
                saveStatus,
                "Image 5MB سے زیادہ نہیں ہونی چاہیے۔",
                "error"
            );

            imageInput.value = "";

            imagePreview.style.display =
                "none";

            return;
        }

        const allowed = [
            "image/jpeg",
            "image/png",
            "image/webp"
        ];

        if(!allowed.includes(file.type)){

            showStatus(
                saveStatus,
                "صرف JPG, PNG یا WebP image استعمال کریں۔",
                "error"
            );

            imageInput.value = "";

            return;
        }

        const reader =
            new FileReader();

        reader.onload =
            function(e){

                imagePreview.src =
                    e.target.result;

                imagePreview.style.display =
                    "block";

            };

        reader.readAsDataURL(file);

    }
);


/* =========================
   PRODUCT ID
========================= */

async function createProductId(){

    const counterRef =
        doc(
            db,
            "system",
            "counters"
        );

    const newNumber =
        await runTransaction(
            db,
            async (transaction) => {

                const counterSnap =
                    await transaction.get(
                        counterRef
                    );

                let current = 0;

                if(counterSnap.exists()){

                    current =
                        Number(
                            counterSnap.data().productNumber || 0
                        );

                }

                const next =
                    current + 1;

                transaction.set(
                    counterRef,
                    {
                        productNumber: next
                    },
                    {
                        merge:true
                    }
                );

                return next;

            }
        );

    return "JT.PRODUCT." +
        String(newNumber)
        .padStart(4,"0");

}


/* =========================
   CLOUDINARY UPLOAD
========================= */

async function uploadImage(file){

    const formData =
        new FormData();

    formData.append(
        "file",
        file
    );

    formData.append(
        "upload_preset",
        CLOUDINARY_PRESET
    );

    const response =
        await fetch(
            CLOUDINARY_URL,
            {
                method:"POST",
                body:formData
            }
        );

    const data =
        await response.json();

    if(!response.ok){

        throw new Error(
            data.error?.message ||
            "Cloudinary upload failed."
        );

    }

    return data.secure_url;

}


/* =========================
   SAVE PRODUCT
========================= */

saveBtn.addEventListener(
    "click",
    async () => {

        const name =
            document
            .getElementById("productName")
            .value
            .trim();

        const category =
            document
            .getElementById("category")
            .value;

        const supplier =
            document
            .getElementById("supplier")
            .value;

        const price =
            Number(
                document
                .getElementById("price")
                .value
            );

        const oldPrice =
            Number(
                document
                .getElementById("oldPrice")
                .value || 0
            );

        const deliveryType =
            document
            .getElementById("deliveryType")
            .value;

        const deliveryCharges =
            Number(
                document
                .getElementById("deliveryCharges")
                .value || 0
            );

        const description =
            document
            .getElementById("description")
            .value
            .trim();

        const supplierLink =
            document
            .getElementById("supplierLink")
            .value
            .trim();

        const socialLink =
            document
            .getElementById("socialLink")
            .value
            .trim();

        const imageFile =
            imageInput.files[0];


        if(!name){

            showStatus(
                saveStatus,
                "Product Name درج کریں۔",
                "error"
            );

            return;
        }


        if(!price || price <= 0){

            showStatus(
                saveStatus,
                "Selling Price درج کریں۔",
                "error"
            );

            return;
        }


        if(!supplierLink){

            showStatus(
                saveStatus,
                "Original Markaz / Daraz Link درج کریں۔",
                "error"
            );

            return;
        }


        if(!imageFile){

            showStatus(
                saveStatus,
                "Product Image منتخب کریں۔",
                "error"
            );

            return;
        }


        saveBtn.disabled = true;

        saveBtn.textContent =
            "⏳ SAVING...";


        try{

            showStatus(
                saveStatus,
                "Product ID بنایا جا رہا ہے...",
                "success"
            );


            /* CREATE ID */

            const productId =
                await createProductId();


            /* UPLOAD IMAGE */

            showStatus(
                saveStatus,
                "Image Cloudinary پر Upload ہو رہی ہے...",
                "success"
            );

            const imageUrl =
                await uploadImage(
                    imageFile
                );


            /* CUSTOMER LINK */

            const orderLink =
                WEBSITE_BASE +
                "order-form.html?Product_ID=" +
                encodeURIComponent(
                    productId
                );


            /* PUBLIC PRODUCT */

            const productData = {

                id:productId,

                name:name,

                category:category,

                price:price,

                oldPrice:oldPrice,

                description:description,

                image:imageUrl,

                deliveryType:deliveryType,

                deliveryCharges:deliveryCharges,

                createdAt:new Date()
            };


            /* PRIVATE SOURCE */

            const sourceData = {

                productId:productId,

                supplier:supplier,

                ordinaryLink:orderLink,

                supplierLink:supplierLink,

                socialLink:socialLink,

                createdAt:new Date()

            };


            showStatus(
                saveStatus,
                "Product Database میں Save ہو رہا ہے...",
                "success"
            );


            await setDoc(
                doc(
                    db,
                    "products",
                    productId
                ),
                productData
            );


            await setDoc(
                doc(
                    db,
                    "productSources",
                    productId
                ),
                sourceData
            );


            /* SHOW GENERATED LINK */

            generatedLink.textContent =
                orderLink;

            generatedLinkBox.classList.remove(
                "hidden"
            );


            showStatus(
                saveStatus,
                "✅ Product کامیابی سے Save ہو گیا۔ Product ID: " +
                productId,
                "success"
            );


            await loadProducts();


            /*
             * IMPORTANT:
             * Form clear نہیں کیا جا رہا،
             * تاکہ آپ فوراً Auto Link Copy کر سکیں۔
             */

        }catch(error){

            console.error(error);

            showStatus(
                saveStatus,
                "❌ Save Failed: " +
                error.message,
                "error"
            );

        }finally{

            saveBtn.disabled = false;

            saveBtn.textContent =
                "💾 SAVE PRODUCT";

        }

    }
);


/* =========================
   COPY GENERATED LINK
========================= */

copyGeneratedLinkBtn.addEventListener(
    "click",
    async () => {

        const link =
            generatedLink.textContent.trim();

        if(!link){

            return;
        }

        try{

            await navigator.clipboard.writeText(
                link
            );

            copyGeneratedLinkBtn.textContent =
                "✅ LINK COPIED";

            setTimeout(
                () => {

                    copyGeneratedLinkBtn.textContent =
                        "📋 COPY JANJUA LINK";

                },
                1800
            );

        }catch(error){

            /*
             * Fallback
             */

            const temp =
                document.createElement("textarea");

            temp.value =
                link;

            document.body.appendChild(
                temp
            );

            temp.select();

            document.execCommand(
                "copy"
            );

            temp.remove();

            copyGeneratedLinkBtn.textContent =
                "✅ LINK COPIED";

            setTimeout(
                () => {

                    copyGeneratedLinkBtn.textContent =
                        "📋 COPY JANJUA LINK";

                },
                1800
            );

        }

    }
);


/* =========================

clearBtn.addEventListener(

/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

    productsList.innerHTML =
        "<p>⏳ Products loading...</p>";

    try{

        const q =
            query(
                collection(
                    db,
                    "products"
                ),
                orderBy(
                    "createdAt",
                    "desc"
                )
            );

        const snapshot =
            await getDocs(q);

        window.allProducts = [];

        snapshot.forEach(
            docSnap => {

                window.allProducts.push({
                    ...docSnap.data(),
                    firestoreId:docSnap.id
                });

            }
        );

        renderProducts(
            window.allProducts
        );

    }catch(error){

        console.error(error);

        productsList.innerHTML =
            "<p style='color:red'>Products load نہیں ہوئے: " +
            escapeHTML(error.message) +
            "</p>";

    }

}


/* =========================
   RENDER PRODUCTS
========================= */

function renderProducts(products){

    if(!products.length){

        productsList.innerHTML =
            "<p>ابھی کوئی Product موجود نہیں۔</p>";

        return;
    }


    productsList.innerHTML =
        products.map(
            product => {

                const orderLink =
                    WEBSITE_BASE +
                    "order-form.html?Product_ID=" +
                    encodeURIComponent(
                        product.id
                    );


                return `

                <div
                    class="product"
                    data-product-id="${escapeHTML(product.id)}"
                >

                    <div class="product-top">

                        <img
                            src="${escapeHTML(product.image)}"
                            alt="${escapeHTML(product.name)}"
                        >

                        <div class="product-info">

                            <div class="product-name">
                                ${escapeHTML(product.name)}
                            </div>

                            <div class="product-id">
                                ${escapeHTML(product.id)}
                            </div>

                            <div>
                                Category:
                                ${escapeHTML(product.category)}
                            </div>

                            <div class="price">
                                Rs. ${escapeHTML(product.price)}
                            </div>

                            ${
                                product.oldPrice
                                ?
                                `<div>
                                    Old Price:
                                    Rs. ${escapeHTML(product.oldPrice)}
                                </div>`
                                :
                                ""
                            }

                        </div>

                    </div>


                    <div class="link-row">

                        <div class="link-label">
                            🔗 JANJUA Customer Link
                        </div>

                        <div class="small-link">
                            ${escapeHTML(orderLink)}
                        </div>

                        <div class="button-row">

                            <button
                                class="btn btn-copy"
                                onclick="copyProductLink('${encodeURIComponent(orderLink)}', this)"
                            >
                                📋 COPY LINK
                            </button>

                        </div>

                    </div>


                    <div class="button-row">

                        <button
                            class="btn btn-danger"
                            onclick="deleteProduct('${encodeURIComponent(product.id)}')"
                        >
                            🗑️ DELETE PRODUCT
                        </button>

                    </div>

                </div>

                `;

            }
        ).join("");

}


/* =========================
   COPY PRODUCT LINK
========================= */

window.copyProductLink =
async function(encodedLink, button){

    const link =
        decodeURIComponent(
            encodedLink
        );

    try{

        await navigator.clipboard.writeText(
            link
        );

    }catch(error){

        const temp =
            document.createElement("textarea");

        temp.value =
            link;

        document.body.appendChild(
            temp
        );

        temp.select();

        document.execCommand(
            "copy"
        );

        temp.remove();

    }

    const oldText =
        button.textContent;

    button.textContent =
        "✅ LINK COPIED";

    setTimeout(
        () => {

            button.textContent =
                oldText;

        },
        1800
    );

};


/* =========================
   DELETE PRODUCT
========================= */

window.deleteProduct =
async function(encodedId){

    const productId =
        decodeURIComponent(
            encodedId
        );


    const confirmDelete =
        confirm(
            "کیا آپ واقعی " +
            productId +
            " کو Delete کرنا چاہتے ہیں؟\n\n" +
            "Database کا Product اور Source record delete ہوگا۔"
        );


    if(!confirmDelete){

        return;
    }


    try{

        await deleteDoc(
            doc(
                db,
                "products",
                productId
            )
        );


        await deleteDoc(
            doc(
                db,
                "productSources",
                productId
            )
        );


        alert(
            "✅ Product successfully deleted."
        );


        await loadProducts();


    }catch(error){

        console.error(error);

        alert(
            "❌ Delete Failed: " +
            error.message
        );

    }

};


/* =========================
   SEARCH
========================= */

searchInput.addEventListener(
    "input",
    () => {

        const term =
            searchInput.value
            .trim()
            .toLowerCase();


        if(!term){

            renderProducts(
                window.allProducts || []
            );

            return;
        }


        const filtered =
            (window.allProducts || [])
            .filter(
                product => {

                    return (

                        String(
                            product.name || ""
                        )
                        .toLowerCase()
                        .includes(term)

                        ||

                        String(
                            product.id || ""
                        )
                        .toLowerCase()
                        .includes(term)

                        ||

                        String(
                            product.category || ""
                        )
                        .toLowerCase()
                        .includes(term)

                    );

                }
            );


        renderProducts(
            filtered
        );

    }
);

</script>
