<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>JANJUA - Admin Panel</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f5f8;
    color:#17202a;
}


/* =========================
   HEADER
========================= */

.admin-header{

    background:
        linear-gradient(
            135deg,
            #07111f,
            #111827,
            #172554
        );

    color:white;

    padding:25px 15px;

    text-align:center;
}

.admin-brand{

    font-size:
        clamp(32px,8vw,60px);

    font-weight:1000;

    letter-spacing:5px;

    text-shadow:
        0 0 20px
        rgba(255,255,255,.25);
}

.admin-title{

    margin-top:7px;

    font-size:18px;

    font-weight:bold;

    letter-spacing:2px;
}

.admin-subtitle{

    margin-top:6px;

    font-size:12px;

    opacity:.75;

    letter-spacing:1px;
}


/* =========================
   MAIN
========================= */

.admin-container{

    width:min(1100px,94%);

    margin:25px auto 50px;
}


/* =========================
   CARD
========================= */

.admin-card{

    background:white;

    border-radius:18px;

    padding:22px;

    margin-bottom:20px;

    box-shadow:
        0 6px 25px
        rgba(0,0,0,.07);

    border:
        1px solid #e8ebef;
}


.admin-card h2{

    margin:
        0
        0
        18px;

    font-size:21px;
}


/* =========================
   LOGIN
========================= */

#loginSection{

    max-width:450px;

    margin:
        35px
        auto;
}


.input-group{

    margin-bottom:14px;
}


.input-group label{

    display:block;

    margin-bottom:6px;

    font-weight:bold;

    font-size:14px;
}


.input-group input,
.input-group select,
.input-group textarea{

    width:100%;

    padding:12px 13px;

    border:
        1px solid #d7dce2;

    border-radius:10px;

    outline:none;

    font-size:15px;

    background:white;
}


.input-group input:focus,
.input-group select:focus,
.input-group textarea:focus{

    border-color:#111827;

    box-shadow:
        0 0 0 3px
        rgba(17,24,39,.08);
}


.input-group textarea{

    min-height:100px;

    resize:vertical;

    direction:auto;

    unicode-bidi:plaintext;
}


/* =========================
   BUTTONS
========================= */

.btn{

    border:0;

    border-radius:10px;

    padding:12px 18px;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s ease;
}


.btn:hover{

    transform:
        translateY(-1px);
}


.btn-primary{

    width:100%;

    background:#111827;

    color:white;
}


.btn-secondary{

    background:#e5e7eb;

    color:#111827;
}


.btn-danger{

    background:#dc2626;

    color:white;
}


.btn-copy{

    background:#2563eb;

    color:white;
}


.btn-logout{

    background:#ef4444;

    color:white;

    padding:
        9px
        15px;

    font-size:13px;
}


/* =========================
   DASHBOARD
========================= */

#adminSection{

    display:none;
}


.top-bar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:12px;

    flex-wrap:wrap;

    margin-bottom:18px;
}


.admin-status{

    padding:
        9px
        13px;

    border-radius:999px;

    background:#ecfdf5;

    color:#047857;

    font-size:13px;

    font-weight:bold;
}


/* =========================
   FORM GRID
========================= */

.form-grid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:
        0
        15px;
}


.full-width{

    grid-column:
        1/-1;
}


/* =========================
   IMAGE
========================= */

.image-preview{

    display:none;

    width:150px;

    height:150px;

    object-fit:cover;

    border-radius:14px;

    margin-top:12px;

    border:
        1px solid #ddd;
}


.upload-status{

    margin-top:8px;

    font-size:13px;

    color:#667085;
}


/* =========================
   PRODUCTS HEADER
========================= */

.products-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;

    flex-wrap:wrap;
}


.products-search{

    width:min(350px,100%);

    padding:11px 13px;

    border:
        1px solid #d7dce2;

    border-radius:10px;

    font-size:14px;

    outline:none;
}


/* =========================
   PRODUCT LIST
========================= */

.product-list{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:15px;

    margin-top:18px;
}


.product-item{

    position:relative;

    background:#fafafa;

    border:
        1px solid #e5e7eb;

    border-radius:15px;

    overflow:hidden;
}


.product-image{

    width:100%;

    height:210px;

    object-fit:cover;

    display:block;

    background:#eee;
}


.product-details{

    padding:14px;
}


.product-details h3{

    margin:
        0
        0
        7px;

    font-size:18px;

    direction:auto;

    unicode-bidi:plaintext;
}


.product-id{

    display:inline-block;

    padding:
        5px
        9px;

    border-radius:7px;

    background:#e0e7ff;

    color:#3730a3;

    font-size:12px;

    font-weight:bold;

    direction:ltr;
}


.product-price{

    margin-top:10px;

    font-size:18px;

    font-weight:bold;

    direction:ltr;

    text-align:right;
}


.product-category{

    margin-top:6px;

    color:#667085;

    font-size:13px;
}


.product-links{

    display:flex;

    flex-wrap:wrap;

    gap:7px;

    margin-top:13px;
}


.product-links button{

    flex:1;

    min-width:100px;

    border:0;

    padding:9px;

    border-radius:8px;

    font-size:12px;

    font-weight:bold;

    cursor:pointer;
}


.order-link-box{

    margin-top:10px;

    padding:9px;

    background:#eef2ff;

    border-radius:8px;

    font-size:11px;

    direction:ltr;

    word-break:break-all;

    color:#3730a3;
}


/* =========================
   MESSAGE
========================= */

.message{

    display:none;

    margin-bottom:15px;

    padding:11px 13px;

    border-radius:9px;

    font-size:14px;

    font-weight:bold;
}


.message.success{

    display:block;

    background:#ecfdf5;

    color:#047857;
}


.message.error{

    display:block;

    background:#fef2f2;

    color:#b91c1c;
}


/* =========================
   EMPTY
========================= */

.empty-products{

    text-align:center;

    padding:45px 20px;

    color:#667085;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .admin-container{

        width:94%;

        margin-top:15px;
    }

    .admin-card{

        padding:16px;

        border-radius:14px;
    }

    .form-grid{

        grid-template-columns:1fr;
    }

    .full-width{

        grid-column:auto;
    }

    .product-list{

        grid-template-columns:1fr;
    }

    .products-header{

        align-items:stretch;
    }

    .products-search{

        width:100%;
    }

    .product-image{

        height:230px;
    }

}


/* =========================
   HIDDEN
========================= */

.hidden{

    display:none !important;
}

</style>

</head>

<script type="module">

/* =========================================
   FIREBASE IMPORTS
========================================= */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged,
    sendPasswordResetEmail,
    browserSessionPersistence,
    setPersistence
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    addDoc,
    setDoc,
    doc,
    getDocs,
    deleteDoc,
    runTransaction,
    query,
    orderBy
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyA8_4ArKXAdfKWZ5miDa5T9qiayL3h_Yzw",

    authDomain:
    "janjua-traders.firebaseapp.com",

    projectId:
    "janjua-traders",

    storageBucket:
    "janjua-traders.firebasestorage.app",

    messagingSenderId:
    "154904774188",

    appId:
    "1:154904774188:web:1830f9d533e77dae6a7389"

};


const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const db =
getFirestore(app);


/* =========================================
   CLOUDINARY
========================================= */

const CLOUDINARY_URL =
"https://api.cloudinary.com/v1_1/r6brgbd/image/upload";


const CLOUDINARY_PRESET =
"janjua_traders";


/* =========================================
   DOM
========================================= */

const loginSection =
document.getElementById(
    "loginSection"
);


const adminSection =
document.getElementById(
    "adminSection"
);


const loginBtn =
document.getElementById(
    "loginBtn"
);


const logoutBtn =
document.getElementById(
    "logoutBtn"
);


const resetPasswordBtn =
document.getElementById(
    "resetPasswordBtn"
);


const saveProductBtn =
document.getElementById(
    "saveProductBtn"
);


const productImageInput =
document.getElementById(
    "productImage"
);


const imagePreview =
document.getElementById(
    "imagePreview"
);


const uploadStatus =
document.getElementById(
    "uploadStatus"
);


const productList =
document.getElementById(
    "productList"
);


const productsLoading =
document.getElementById(
    "productsLoading"
);


const productsSearch =
document.getElementById(
    "productsSearch"
);


let allProducts = [];


/* =========================================
   PERSISTENCE
========================================= */

setPersistence(
    auth,
    browserSessionPersistence
);


/* =========================================
   MESSAGE
========================================= */

function showMessage(
    element,
    text,
    type
){

    element.textContent =
        text;

    element.className =
        "message " +
        type;


    setTimeout(
        function(){

            element.className =
                "message";

        },
        5000
    );

}


/* =========================================
   LOGIN
========================================= */

loginBtn.addEventListener(
    "click",
    async function(){

        const email =
        document.getElementById(
            "email"
        )
        .value
        .trim();


        const password =
        document.getElementById(
            "password"
        )
        .value;


        if(!email || !password){

            showMessage(
                document.getElementById(
                    "loginMessage"
                ),
                "Email اور Password دونوں درج کریں۔",
                "error"
            );

            return;

        }


        try{

            loginBtn.disabled =
                true;

            loginBtn.textContent =
                "LOGINING...";


            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        }catch(error){

            console.error(
                error
            );


            showMessage(
                document.getElementById(
                    "loginMessage"
                ),
                "Login ناکام۔ Email یا Password چیک کریں۔",
                "error"
            );

        }finally{

            loginBtn.disabled =
                false;

            loginBtn.textContent =
                "LOGIN";

        }

    }
);


/* =========================================
   RESET PASSWORD
========================================= */

resetPasswordBtn.addEventListener(
    "click",
    async function(){

        const email =
        document.getElementById(
            "email"
        )
        .value
        .trim();


        if(!email){

            showMessage(
                document.getElementById(
                    "loginMessage"
                ),
                "پہلے Email درج کریں۔",
                "error"
            );

            return;

        }


        try{

            await sendPasswordResetEmail(
                auth,
                email
            );


            showMessage(
                document.getElementById(
                    "loginMessage"
                ),
                "Password reset email بھیج دی گئی ہے۔",
                "success"
            );


        }catch(error){

            console.error(
                error
            );


            showMessage(
                document.getElementById(
                    "loginMessage"
                ),
                "Password reset نہیں ہو سکا۔",
                "error"
            );

        }

    }
);


/* =========================================
   LOGOUT
========================================= */

logoutBtn.addEventListener(
    "click",
    async function(){

        await signOut(
            auth
        );

    }
);


/* =========================================
   AUTH STATE
========================================= */

onAuthStateChanged(
    auth,
    async function(user){

        if(user){

            loginSection.style.display =
                "none";

            adminSection.style.display =
                "block";

            await loadProducts();

        }else{

            loginSection.style.display =
                "block";

            adminSection.style.display =
                "none";

        }

    }
);


/* =========================================
   IMAGE PREVIEW
========================================= */

productImageInput.addEventListener(
    "change",
    function(){

        const file =
        this.files[0];


        if(!file){

            imagePreview.style.display =
                "none";

            return;

        }


        if(file.size > 5 * 1024 * 1024){

            showMessage(
                document.getElementById(
                    "adminMessage"
                ),
                "Image 5MB سے زیادہ نہیں ہونی چاہیے۔",
                "error"
            );

            this.value =
                "";

            return;

        }


        const reader =
        new FileReader();


        reader.onload =
        function(event){

            imagePreview.src =
                event.target.result;

            imagePreview.style.display =
                "block";

        };


        reader.readAsDataURL(
            file
        );

    }
);


/* =========================================
   CLOUDINARY UPLOAD
========================================= */

async function uploadImage(
    file
){

    if(!file){

        throw new Error(
            "Product image منتخب کریں۔"
        );

    }


    if(file.size >
        5 * 1024 * 1024
    ){

        throw new Error(
            "Image 5MB سے زیادہ ہے۔"
        );

    }


    uploadStatus.textContent =
        "Image uploading...";


    const formData =
        new FormData();


    formData.append(
        "file",
        file
    );


    formData.append(
        "upload_preset",
        CLOUDINARY_PRESET
    );


    const response =
    await fetch(
        CLOUDINARY_URL,
        {
            method:"POST",
            body:formData
        }
    );


    if(!response.ok){

        throw new Error(
            "Image upload failed."
        );

    }


    const data =
        await response.json();


    if(!data.secure_url){

        throw new Error(
            "Image URL نہیں ملی۔"
        );

    }


    uploadStatus.textContent =
        "Image uploaded successfully.";

    return data.secure_url;

}


/* =========================================
   AUTOMATIC PRODUCT ID
========================================= */

async function generateProductId(){

    const counterRef =
        doc(
            db,
            "system",
            "counters"
        );


    const number =
    await runTransaction(
        db,
        async function(transaction){

            const counterSnap =
                await transaction.get(
                    counterRef
                );


            let currentNumber =
                0;


            if(counterSnap.exists()){

                currentNumber =
                    Number(
                        counterSnap.data()
                        .productNumber || 0
                    );

            }


            /*
             * First run:
             * Check existing products
             * so old IDs are not duplicated.
             */

            if(
                currentNumber === 0 &&
                !counterSnap.exists()
            ){

                const productsSnapshot =
                    await getDocs(
                        collection(
                            db,
                            "products"
                        )
                    );


                productsSnapshot.forEach(
                    function(item){

                        const data =
                            item.data();


                        const id =
                            String(
                                data.id || ""
                            );


                        const match =
                            id.match(
                                /^JT\.PRODUCT\.(\d+)$/
                            );


                        if(match){

                            const number =
                                Number(
                                    match[1]
                                );


                            if(
                                number >
                                currentNumber
                            ){

                                currentNumber =
                                    number;

                            }

                        }

                    }
                );

            }


            const nextNumber =
                currentNumber + 1;


            transaction.set(
                counterRef,
                {
                    productNumber:
                        nextNumber
                },
                {
                    merge:true
                }
            );


            return nextNumber;

        }
    );


    return(
        "JT.PRODUCT." +
        String(number)
        .padStart(4,"0")
    );

}


/* =========================================
   SAVE PRODUCT
========================================= */

saveProductBtn.addEventListener(
    "click",
    async function(){

        const message =
        document.getElementById(
            "adminMessage"
        );


        try{

            saveProductBtn.disabled =
                true;

            saveProductBtn.textContent =
                "SAVING...";


            const name =
            document.getElementById(
                "productName"
            )
            .value
            .trim();


            const category =
            document.getElementById(
                "category"
            )
            .value
            .trim();


            const price =
            Number(
                document.getElementById(
                    "sellingPrice"
                )
                .value
            );


            const oldPrice =
            Number(
                document.getElementById(
                    "oldPrice"
                )
                .value || 0
            );


            const deliveryType =
            document.getElementById(
                "deliveryType"
            )
            .value;


            const deliveryCharges =
            Number(
                document.getElementById(
                    "deliveryCharges"
                )
                .value || 0
            );


            const description =
            document.getElementById(
                "description"
            )
            .value
            .trim();


            const imageFile =
            productImageInput.files[0];


            const ordinaryLink =
            document.getElementById(
                "ordinaryLink"
            )
            .value
            .trim();


            const supplierLink =
            document.getElementById(
                "supplierLink"
            )
            .value
            .trim();


            const socialLink =
            document.getElementById(
                "socialLink"
            )
            .value
            .trim();


            const supplier =
            document.getElementById(
                "supplier"
            )
            .value
            .trim();


            if(!name){

                throw new Error(
                    "Product Name لازمی ہے۔"
                );

            }


            if(!category){

                throw new Error(
                    "Category منتخب کریں۔"
                );

            }


            if(
                !Number.isFinite(price) ||
                price <= 0
            ){

                throw new Error(
                    "Selling Price درست درج کریں۔"
                );

            }


            if(
                deliveryType === "paid" &&
                deliveryCharges <= 0
            ){

                throw new Error(
                    "Paid Delivery کے لیے Delivery Charges درج کریں۔"
                );

            }


            if(!imageFile){

                throw new Error(
                    "Product Image منتخب کریں۔"
                );

            }


            /* =========================
               UPLOAD IMAGE
            ========================= */

            const imageUrl =
                await uploadImage(
                    imageFile
                );


            /* =========================
               AUTOMATIC ID
            ========================= */

            const productId =
                await generateProductId();


            /* =========================
               CREATE PRODUCT
            ========================= */

            const createdAt =
                new Date().toISOString();


            await setDoc(
                doc(
                    db,
                    "products",
                    productId
                ),
                {

                    id:
                        productId,

                    name:
                        name,

                    category:
                        category,

                    price:
                        price,

                    oldPrice:
                        oldPrice,

                    description:
                        description,

                    image:
                        imageUrl,

                    deliveryType:
                        deliveryType,

                    deliveryCharges:
                        deliveryCharges,

                    createdAt:
                        createdAt

                }
            );


            /* =========================
               SAVE SOURCE INFO
               ADMIN ONLY
            ========================= */

            await setDoc(
                doc(
                    db,
                    "productSources",
                    productId
                ),
                {

                    productId:
                        productId,

                    supplier:
                        supplier,

                    ordinaryLink:
                        ordinaryLink,

                    supplierLink:
                        supplierLink,

                    socialLink:
                        socialLink,

                    createdAt:
                        createdAt

                }
            );


            showMessage(
                message,
                "Product کامیابی سے save ہوگیا۔ Product ID: " +
                productId,
                "success"
            );


            clearProductForm();


            await loadProducts();


        }catch(error){

            console.error(
                "SAVE PRODUCT ERROR:",
                error
            );


            showMessage(
                message,
                error.message ||
                "Product save نہیں ہو سکا۔",
                "error"
            );

        }finally{

            saveProductBtn.disabled =
                false;

            saveProductBtn.textContent =
                "💾 SAVE PRODUCT";

        }

    }
);

/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts(){

    productsLoading.style.display =
        "block";

    productsLoading.textContent =
        "Products loading...";


    try{

        const snapshot =
        await getDocs(
            collection(
                db,
                "products"
            )
        );


        allProducts = [];


        snapshot.forEach(
            function(item){

                const data =
                    item.data();


                allProducts.push({

                    firestoreId:
                        item.id,

                    ...data

                });

            }
        );


        allProducts.sort(
            function(a,b){

                return(
                    new Date(
                        b.createdAt || 0
                    ) -

                    new Date(
                        a.createdAt || 0
                    )
                );

            }
        );


        productsLoading.style.display =
            "none";


        renderProducts(
            allProducts
        );


    }catch(error){

        console.error(
            error
        );


        productsLoading.style.display =
            "block";

        productsLoading.textContent =
            "Products load نہیں ہو سکے۔";

    }

}


/* =========================================
   RENDER PRODUCTS
========================================= */

function renderProducts(
    list
){

    if(!list.length){

        productList.innerHTML = `

            <div
                class="empty-products"
                style="grid-column:1/-1"
            >

                ابھی کوئی Product موجود نہیں۔

            </div>

        `;

        return;

    }


    productList.innerHTML =

    list
    .map(
        function(product){

            const image =
                product.image ||
                "https://via.placeholder.com/500x500?text=Product";


            const orderLink =
                "order-form.html?Product_ID=" +
                encodeURIComponent(
                    product.id ||
                    product.firestoreId
                );


            return `

                <div
                    class="product-item"
                >

                    <img

                        class="product-image"

                        src="${
                            escapeAttribute(
                                image
                            )
                        }"

                        alt="${
                            escapeAttribute(
                                product.name ||
                                "Product"
                            )
                        }"

                        onerror="
                        this.src='https://via.placeholder.com/500x500?text=Product'
                        "

                    >


                    <div
                        class="product-details"
                    >

                        <h3 dir="auto">

                            ${escapeHtml(
                                product.name ||
                                "Product"
                            )}

                        </h3>


                        <span
                            class="product-id"
                        >

                            ${escapeHtml(
                                product.id ||
                                product.firestoreId
                            )}

                        </span>


                        <div
                            class="product-price"
                        >

                            Rs.
                            ${Number(
                                product.price || 0
                            ).toLocaleString("en-PK")}

                        </div>


                        <div
                            class="product-category"
                        >

                            Category:
                            ${escapeHtml(
                                product.category ||
                                "Other"
                            )}

                        </div>


                        <div
                            class="product-links"
                        >

                            <button
                                class="btn-copy"
                                data-copy="${escapeAttribute(orderLink)}"
                                type="button"
                            >
                                Copy Order Link
                            </button>


                            <button
                                class="btn-danger delete-btn"
                                data-id="${escapeAttribute(
                                    product.firestoreId
                                )}"
                                type="button"
                            >
                                Delete
                            </button>

                        </div>


                        <div
                            class="order-link-box"
                        >

                            ${escapeHtml(
                                orderLink
                            )}

                        </div>

                    </div>

                </div>

            `;

        }
    )
    .join("");


    productList
    .querySelectorAll(
        ".btn-copy"
    )
    .forEach(
        function(button){

            button.addEventListener(
                "click",
                async function(){

                    const link =
                        this.dataset.copy;


                    try{

                        await navigator.clipboard.writeText(
                            link
                        );


                        this.textContent =
                            "Copied ✓";


                        setTimeout(
                            () => {

                                this.textContent =
                                    "Copy Order Link";

                            },
                            1500
                        );


                    }catch(error){

                        prompt(
                            "Copy this link:",
                            link
                        );

                    }

                }
            );

        }
    );


    productList
    .querySelectorAll(
        ".delete-btn"
    )
    .forEach(
        function(button){

            button.addEventListener(
                "click",
                async function(){

                    const id =
                        this.dataset.id;


                    const product =
                        allProducts.find(
                            function(item){

                                return(
                                    item.firestoreId ===
                                    id
                                );

                            }
                        );


                    if(!product){

                        return;

                    }


                    const confirmed =
                        confirm(
                            "کیا آپ واقعی یہ Product delete کرنا چاہتے ہیں؟"
                        );


                    if(!confirmed){

                        return;

                    }


                    try{

                        await deleteDoc(
                            doc(
                                db,
                                "products",
                                id
                            )
                        );


                        /*
                         * Delete source information
                         */

                        await deleteDoc(
                            doc(
                                db,
                                "productSources",
                                product.id ||
                                id
                            )
                        );


                        await loadProducts();


                    }catch(error){

                        console.error(
                            error
                        );


                        showMessage(
                            document.getElementById(
                                "adminMessage"
                            ),
                            "Product delete نہیں ہو سکا۔",
                            "error"
                        );

                    }

                }
            );

        }
    );

}


/* =========================================
   SEARCH PRODUCTS
========================================= */

productsSearch.addEventListener(
    "input",
    function(){

        const text =
            this.value
            .trim()
            .toLowerCase();


        if(!text){

            renderProducts(
                allProducts
            );

            return;

        }


        const filtered =
            allProducts.filter(
                function(product){

                    return(

                        String(
                            product.name ||
                            ""
                        )
                        .toLowerCase()
                        .includes(text)

                        ||

                        String(
                            product.id ||
                            ""
                        )
                        .toLowerCase()
                        .includes(text)

                        ||

                        String(
                            product.category ||
                            ""
                        )
                        .toLowerCase()
                        .includes(text)

                    );

                }
            );


        renderProducts(
            filtered
        );

    }
);


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(value){

    return escapeHtml(
        value
    );

}
