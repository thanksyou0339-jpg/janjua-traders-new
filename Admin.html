<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital Janjua Trading - Admin Panel</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f6f8;
    color:#222;
}

.container{
    width:min(800px,94%);
    margin:20px auto;
}

.header{
    background:#111827;
    color:white;
    padding:25px 15px;
    border-radius:15px;
    text-align:center;
    margin-bottom:20px;
    overflow:hidden;
}

.brand{
    font-size:30px;
    font-weight:bold;
    animation:brandMove 3s ease-in-out infinite;
}

.subtitle{
    margin-top:8px;
    font-size:15px;
    letter-spacing:1px;
    opacity:.9;
}

@keyframes brandMove{

    0%{
        transform:translateY(0);
    }

    25%{
        transform:translateY(-4px);
    }

    50%{
        transform:translateY(0);
    }

    75%{
        transform:translateY(4px);
    }

    100%{
        transform:translateY(0);
    }
}

.card{
    background:white;
    padding:20px;
    border-radius:14px;
    margin-bottom:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

h2{
    margin-top:0;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:7px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:16px;
    font-family:Arial,sans-serif;
    background:white;
}

input[type="number"]{
    direction:ltr;
    text-align:left;
}

input[type="url"],
input[type="email"],
input[type="password"]{
    direction:ltr;
    text-align:left;
}

input[type="text"]{
    direction:auto;
    unicode-bidi:plaintext;
}

textarea{
    min-height:100px;
    resize:vertical;
    direction:auto;
    unicode-bidi:plaintext;
}

button{
    border:0;
    padding:12px 18px;
    border-radius:9px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.primary{
    width:100%;
    margin-top:20px;
    background:#111827;
    color:white;
}

.primary:hover{
    opacity:.92;
}

.secondary{
    background:#e5e7eb;
    color:#111827;
}

.danger{
    background:#dc2626;
    color:white;
}

.hidden{
    display:none;
}

.message{
    padding:12px;
    border-radius:9px;
    margin-top:15px;
    display:none;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.image-upload-box{
    border:2px dashed #cbd5e1;
    padding:18px;
    border-radius:12px;
    text-align:center;
    margin-top:8px;
}

.image-upload-box input{
    border:0;
    padding:5px;
}

.image-preview{
    width:180px;
    height:180px;
    object-fit:cover;
    border-radius:12px;
    margin:15px auto 0;
    display:none;
    border:1px solid #ddd;
}

.product-item{
    border:1px solid #ddd;
    padding:15px;
    border-radius:12px;
    margin-top:12px;
}

.product-item img{
    width:100px;
    height:100px;
    object-fit:cover;
    border-radius:10px;
    margin-bottom:10px;
}

.product-item strong{
    font-size:18px;
}

.product-id{
    font-size:13px;
    color:#777;
    direction:ltr;
    text-align:left;
    margin-top:5px;
}

.product-actions{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.product-actions button{
    flex:1;
}

.source-links{
    margin-top:12px;
    padding:12px;
    background:#f8fafc;
    border-radius:9px;
}

.source-links a{
    display:block;
    margin-top:8px;
    color:#2563eb;
    text-decoration:none;
    word-break:break-all;
}

.source-links a:hover{
    text-decoration:underline;
}

.small-note{
    font-size:13px;
    color:#666;
    margin-top:6px;
}

@media(max-width:500px){

    .card{
        padding:15px;
    }

    .brand{
        font-size:24px;
    }

    .product-actions{
        flex-direction:column;
    }

}

</style>
</head>


<body>

<div class="container">


<!-- HEADER -->

<div class="header">

    <div class="brand">
        DIGITAL JANJUA TRADING
    </div>

    <div class="subtitle">
        DIGITAL ONLINE MARKETING PLATFORM
    </div>

</div>


<!-- LOGIN -->

<div id="loginSection" class="card">

    <h2>Admin Login</h2>

    <label>Email</label>

    </button>

    <div

</div>


<!-- ADMIN -->

<div id="adminSection" class="hidden">


<!-- PRODUCT ADD -->

<div class="card">

    <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:10px;
    ">

        <h2>
            Product Add کریں
        </h2>

        <button

        </button>

    <!-- PRODUCT NAME -->

        Product Name

    <input

        dir="auto"

    >


    <!-- CATEGORY -->

    <label>
        Category
    </label>

    <select id="productCategory">

        <option value="Shoes">
            Shoes
        </option>

        <option value="Clothes">
            Clothes
        </option>

        <option value="Beauty">
            Beauty
        </option>

        <option value="Electronics">
            Electronics
        </option>

        <option value="Other">
            Other
        </option>

    </select>


    <!-- PRICE -->

    <label>
        Selling Price
    </label>

    <input
        type="number"
        id="productPrice"

        min="0"
    >


    <!-- OLD PRICE -->

    <label>
        Old Price
    </label>

    <input

    <!-- DESCRIPTION -->

    <label>

    <textarea

    <!-- IMAGE -->

    </label>

        <input

        <div class="small-note">

        <img

    </div>


    <!-- ORDINARY LINK -->

    <label>

    <input

        placeholder="https://..."
    >

    <div class="small-note">

    </div>


    <!-- ORIGINAL SUPPLIER -->

    <label>
        Original Markaz / Daraz Link
    </label>

    <input
        type="url"
        id="supplierLink"
        placeholder="https://..."
    >

    <div class="small-note">
        یہ Link صرف Admin کے لیے محفوظ رہے گا۔
    </div>


    <!-- SOCIAL -->

    <label>
        TikTok / Facebook Link
    </label>

    <input
        type="url"
        id="socialLink"
        placeholder="https://..."
    >


    <!-- SUPPLIER -->

    <label>
        Supplier
    </label>

    <select id="productSupplier">

        <option value="Markaz">
            Markaz
        </option>

        <option value="Daraz">
            Daraz
        </option>

        <option value="Naveed">
            Naveed
        </option>

        <option value="Other">
            Other
        </option>

    </select>


    <!-- SAVE -->

    <button
        class="primary"
        id="saveProductBtn"
    >
        SAVE PRODUCT
    </button>

    <div
        id="productMessage"
        class="message"
    ></div>

</div>


<!-- SAVED PRODUCTS -->

<div class="card">

    <h2>
        Saved Products
    </h2>

    <div id="productList">
        Products loading...
    </div>

</div>


</div>

</div>


<script type="module">


/* =========================================
   FIREBASE
========================================= */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    setDoc
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyA8_4ArKXAdfKWZ5mi5DaT9qiayL3h_Yzw",

    authDomain:
    "janjua-traders.firebaseapp.com",

    projectId:
    "janjua-traders",

    storageBucket:
    "janjua-traders.firebasestorage.app",

    messagingSenderId:
    "154904774188",

    appId:
    "1:154904774188:web:1830f9d533e77dae6a7389"

};


const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const db =
getFirestore(app);


/* =========================================
   CLOUDINARY
========================================= */

const CLOUDINARY_CLOUD_NAME =
"r6brgbd8";


const CLOUDINARY_UPLOAD_PRESET =
"janjua_traders";


/* =========================================
   ELEMENTS
========================================= */

const loginSection =
document.getElementById("loginSection");

const adminSection =
document.getElementById("adminSection");

const loginBtn =
document.getElementById("loginBtn");

const logoutBtn =
document.getElementById("logoutBtn");

const loginMessage =
document.getElementById("loginMessage");

const productMessage =
document.getElementById("productMessage");

const productList =
document.getElementById("productList");

const imageFile =
document.getElementById("productImageFile");

const imagePreview =
document.getElementById("imagePreview");


/* =========================================
   MESSAGE
========================================= */

function showMessage(
    element,
    text,
    type
){

    element.textContent =
    text;

    element.className =
    "message " + type;

    element.style.display =
    "block";

}


/* =========================================
   IMAGE PREVIEW
========================================= */

imageFile.addEventListener(
    "change",
    function(){

        const file =
        this.files[0];

        if(!file){

            imagePreview.style.display =
            "none";

            imagePreview.src =
            "";

            return;
        }


        if(file.size > 5 * 1024 * 1024){

            alert(
                "Image 5MB سے زیادہ نہیں ہونی چاہیے۔"
            );

            this.value =
            "";

            imagePreview.style.display =
            "none";

            return;
        }


        const allowedTypes = [
            "image/jpeg",
            "image/png",
            "image/webp"
        ];


        if(!allowedTypes.includes(file.type)){

            alert(
                "صرف JPG, PNG یا WebP image استعمال کریں۔"
            );

            this.value =
            "";

            imagePreview.style.display =
            "none";

            return;
        }


        const reader =
        new FileReader();


        reader.onload =
        function(event){

            imagePreview.src =
            event.target.result;

            imagePreview.style.display =
            "block";

        };


        reader.readAsDataURL(file);

    }
);


/* =========================================
   LOGIN
========================================= */

loginBtn.addEventListener(
    "click",
    async function(){

        const email =
        document
        .getElementById("loginEmail")
        .value
        .trim();


        const password =
        document
        .getElementById("loginPassword")
        .value;


        if(!email || !password){

            showMessage(
                loginMessage,
                "Email اور Password درج کریں۔",
                "error"
            );

            return;
        }


        try{

            loginBtn.disabled =
            true;

            loginBtn.textContent =
            "LOGIN ہو رہا ہے...";


            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        }catch(error){

            console.error(error);

            showMessage(
                loginMessage,
                "Login نہیں ہو سکا۔ Email یا Password چیک کریں۔",
                "error"
            );


        }finally{

            loginBtn.disabled =
            false;

            loginBtn.textContent =
            "LOGIN";

        }

    }
);


/* =========================================
   AUTH STATE
========================================= */

onAuthStateChanged(
    auth,
    function(user){

        if(user){

            loginSection
            .classList
            .add("hidden");


            adminSection
            .classList
            .remove("hidden");


            loadProducts();

        }else{

            loginSection
            .classList
            .remove("hidden");


            adminSection
            .classList
            .add("hidden");

        }

    }
);


/* =========================================
   LOGOUT
========================================= */

logoutBtn.addEventListener(
    "click",
    async function(){

        await signOut(auth);

    }
);


/* =========================================
   CLOUDINARY UPLOAD
========================================= */

async function uploadImageToCloudinary(file){

    const url =
    "https://api.cloudinary.com/v1_1/" +
    CLOUDINARY_CLOUD_NAME +
    "/image/upload";


    const formData =
    new FormData();


    formData.append(
        "file",
        file
    );


    formData.append(
        "upload_preset",
        CLOUDINARY_UPLOAD_PRESET
    );


    const response =
    await fetch(
        url,
        {
            method:"POST",
            body:formData
        }
    );


    const result =
    await response.json();


    if(!response.ok){

        throw new Error(
            result.error?.message ||
            "Cloudinary upload failed"
        );

    }


    return result.secure_url;

}


/* =========================================
   SAVE PRODUCT
========================================= */

document
.getElementById("saveProductBtn")
.addEventListener(
    "click",
    async function(){

        const name =
        document
        .getElementById("productName")
        .value
        .trim();


        const category =
        document
        .getElementById("productCategory")
        .value;


        const price =
        Number(
            document
            .getElementById("productPrice")
            .value
        );


        const oldPrice =
        Number(
            document
            .getElementById("productOldPrice")
            .value
        ) || 0;


        const description =
        document
        .getElementById("productDescription")
        .value
        .trim();


        const ordinaryLink =
        document
        .getElementById("ordinaryLink")
        .value
        .trim();


        const supplierLink =
        document
        .getElementById("supplierLink")
        .value
        .trim();


        const socialLink =
        document
        .getElementById("socialLink")
        .value
        .trim();


        const supplier =
        document
        .getElementById("productSupplier")
        .value;


        const file =
        imageFile.files[0];


        /* VALIDATION */

        if(
            !name ||
            !price ||
            !file
        ){

            showMessage(
                productMessage,
                "Product Name، Price اور Image ضروری ہیں۔",
                "error"
            );

            return;
        }


        if(
            ordinaryLink &&
            !isValidUrl(ordinaryLink)
        ){

            showMessage(
                productMessage,
                "Ordinary Link درست نہیں ہے۔",
                "error"
            );

            return;
        }


        if(
            supplierLink &&
            !isValidUrl(supplierLink)
        ){

            showMessage(
                productMessage,
                "Original Supplier Link درست نہیں ہے۔",
                "error"
            );

            return;
        }


        if(
            socialLink &&
            !isValidUrl(socialLink)
        ){

            showMessage(
                productMessage,
                "TikTok/Facebook Link درست نہیں ہے۔",
                "error"
            );

            return;
        }


        const saveBtn =
        document
        .getElementById("saveProductBtn");


        try{

            saveBtn.disabled =
            true;

            saveBtn.textContent =
            "Image Upload ہو رہی ہے...";


            /* CLOUDINARY */

            const imageUrl =
            await uploadImageToCloudinary(
                file
            );


            saveBtn.textContent =
            "Product Save ہو رہا ہے...";


            /* PRODUCT ID */

            const productId =
            "JT-" + Date.now();


            /* PUBLIC PRODUCT */

            await addDoc(
                collection(
                    db,
                    "products"
                ),
                {

                    id:productId,

                    name:name,

                    category:category,

                    price:price,

                    oldPrice:oldPrice,

                    description:description,

                    image:imageUrl,

                    createdAt:
                    new Date().toISOString()

                }
            );


            /* PRIVATE SOURCE DATA */

            await setDoc(
                doc(
                    db,
                    "productSources",
                    productId
                ),
                {

                    productId:productId,

                    supplier:supplier,

                    ordinaryLink:
                    ordinaryLink,

                    supplierLink:
                    supplierLink,

                    socialLink:
                    socialLink,

                    createdAt:
                    new Date().toISOString()

                }
            );


            showMessage(
                productMessage,
                "Product کامیابی سے Save ہو گیا۔",
                "success"
            );


            /* RESET */

            document
            .getElementById("productName")
            .value="";


            document
            .getElementById("productPrice")
            .value="";


            document
            .getElementById("productOldPrice")
            .value="";


            document
            .getElementById("productDescription")
            .value="";


            document
            .getElementById("ordinaryLink")
            .value="";


            document
            .getElementById("supplierLink")
            .value="";


            document
            .getElementById("socialLink")
            .value="";


            imageFile.value =
            "";

            imagePreview.src =
            "";

            imagePreview.style.display =
            "none";


            await loadProducts();


        }catch(error){

            console.error(
                "SAVE ERROR:",
                error
            );


            showMessage(
                productMessage,
                "Product save نہیں ہو سکا: " +
                error.message,
                "error"
            );


        }finally{

            saveBtn.disabled =
            false;

            saveBtn.textContent =
            "SAVE PRODUCT";

        }

    }
);


/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts(){

    productList.innerHTML =
    "Products loading...";


    try{

        const snapshot =
        await getDocs(
            collection(
                db,
                "products"
            )
        );


        if(snapshot.empty){

            productList.innerHTML =
            "ابھی کوئی Product موجود نہیں۔";

            return;
        }


        productList.innerHTML =
        "";


        for(
            const item of snapshot.docs
        ){

            const product =
            item.data();


            const sourceRef =
            doc(
                db,
                "productSources",
                product.id || item.id
            );


            let source = {};


            try{

                const sourceSnapshot =
                await getDocs(
                    collection(
                        db,
                        "productSources"
                    )
                );

                sourceSnapshot.forEach(
                    function(sourceDoc){

                        if(
                            sourceDoc.id ===
                            (product.id || item.id)
                        ){

                            source =
                            sourceDoc.data();

                        }

                    }
                );

            }catch(sourceError){

                console.error(
                    sourceError
                );

            }


            const div =
            document.createElement(
                "div"
            );


            div.className =
            "product-item";


            const image =
            product.image || "";


            let sourceLinks =
            "";


            if(source.ordinaryLink){

                sourceLinks += `
                    <a
                        href="${escapeHtml(source.ordinaryLink)}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        🔗 Ordinary Link
                    </a>
                `;

            }


            if(source.supplierLink){

                sourceLinks += `
                    <a
                        href="${escapeHtml(source.supplierLink)}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        🛒 Original ${escapeHtml(source.supplier || "Supplier")} Link
                    </a>
                `;

            }


            if(source.socialLink){

                sourceLinks += `
                    <a
                        href="${escapeHtml(source.socialLink)}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        📱 TikTok / Facebook Link
                    </a>
                `;

            }


            div.innerHTML = `

                ${
                    image
                    ?
                    `
                    <img
                        src="${escapeHtml(image)}"
                        alt="${escapeHtml(product.name || "")}"
                    >
                    `
                    :
                    ""
                }


                <strong>
                    ${escapeHtml(product.name || "")}
                </strong>


                <div>
                    Rs.
                    ${Number(
                        product.price || 0
                    ).toLocaleString("en-PK")}
                </div>


                <div>
                    ${escapeHtml(
                        product.category || ""
                    )}
                </div>


                <div class="product-id">
                    Product ID:
                    ${escapeHtml(
                        product.id || item.id
                    )}
                </div>


                ${
                    source.supplier
                    ?
                    `
                    <div class="small-note">
                        Supplier:
                        ${escapeHtml(
                            source.supplier
                        )}
                    </div>
                    `
                    :
                    ""
                }


                ${
                    sourceLinks
                    ?
                    `
                    <div class="source-links">
                        <strong>
                            🔐 Source Links
                        </strong>

                        ${sourceLinks}
                    </div>
                    `
                    :
                    ""
                }


                <div class="product-actions">

                    <button
                        class="danger"
                        data-delete="${item.id}"
                    >
                        DELETE
                    </button>

                </div>

            `;


            productList.appendChild(
                div
            );

        }


        document
        .querySelectorAll(
            "[data-delete]"
        )
        .forEach(
            function(button){

                button.addEventListener(
                    "click",
                    function(){

                        deleteProduct(
                            this.getAttribute(
                                "data-delete"
                            )
                        );

                    }
                );

            }
        );


    }catch(error){

        console.error(error);

        productList.innerHTML =
        "Products load نہیں ہو سکے۔";

    }

}


/* =========================================
   DELETE PRODUCT
========================================= */

async function deleteProduct(
    documentId
){

    if(
        !confirm(
            "کیا آپ یہ Product delete کرنا چاہتے ہیں؟"
        )
    ){

        return;

    }


    try{

        /*
         * پہلے Product data دیکھیں
         */

        const snapshot =
        await getDocs(
            collection(
                db,
                "products"
            )
        );


        let productId =
        documentId;


        snapshot.forEach(
            function(item){

                if(item.id === documentId){

                    const data =
                    item.data();

                    productId =
                    data.id || item.id;

                }

            }
        );


        /*
         * Public product delete
         */

        await deleteDoc(
            doc(
                db,
                "products",
                documentId
            )
        );


        /*
         * Private source delete
         */

        try{

            await deleteDoc(
                doc(
                    db,
                    "productSources",
                    productId
                )
            );

        }catch(sourceError){

            console.log(
                "Source document not found:",
                sourceError
            );

        }


        await loadProducts();


    }catch(error){

        console.error(error);

        alert(
            "Product delete نہیں ہو سکا۔"
        );

    }

}


/* =========================================
   URL VALIDATION
========================================= */

function isValidUrl(value){

    try{

        const url =
        new URL(value);

        return(
            url.protocol === "http:" ||
            url.protocol === "https:"
        );

    }catch(error){

        return false;

    }

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
