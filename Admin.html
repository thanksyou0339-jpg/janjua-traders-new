<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JANJUA - Admin Panel</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f5f8;
    color:#17202a;
}

.main-header{
    background:linear-gradient(135deg,#063d2d,#0b5b43,#063d2d);
    color:#fff;
    text-align:center;
    padding:22px 12px 18px;
    box-shadow:0 4px 14px rgba(0,0,0,.18);
}

.janjua-animation{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:3px;
    direction:ltr;
}

.j-letter{
    position:relative;
    display:inline-block;
    font-size:38px;
    font-weight:900;
    color:#f7d774;
    text-shadow:0 2px 5px rgba(0,0,0,.4);
    animation:janjuaFloat 2.8s ease-in-out infinite;
}

.j-letter:nth-child(2){animation-delay:.15s}
.j-letter:nth-child(3){animation-delay:.30s}
.j-letter:nth-child(4){animation-delay:.45s}
.j-letter:nth-child(5){animation-delay:.60s}
.j-letter:nth-child(6){animation-delay:.75s}

.decor{
    position:absolute;
    font-size:12px;
    font-style:normal;
    color:#fff;
    animation:decorSpin 3s ease-in-out infinite;
}

.d1{top:-5px;left:-5px}
.d2{bottom:-4px;right:-5px}
.d3{top:-7px;right:-4px}
.d4{bottom:-5px;left:-5px}
.d5{top:-5px;left:-5px}
.d6{bottom:-4px;right:-4px}

@keyframes janjuaFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-4px)}
}

@keyframes decorSpin{
    0%,100%{transform:rotate(0) scale(1)}
    50%{transform:rotate(15deg) scale(1.15)}
}

.platform-title{
    margin-top:5px;
    font-size:13px;
    font-weight:bold;
    letter-spacing:1px;
}

.container{
    width:95%;
    max-width:1000px;
    margin:20px auto;
}

.card{
    background:#fff;
    border-radius:14px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
}

.card h2{
    margin-top:0;
    color:#07583f;
    font-size:21px;
}

label{
    display:block;
    font-weight:bold;
    margin:13px 0 6px;
}

input,
select,
textarea{
    width:100%;
    border:1px solid #ccd4da;
    border-radius:9px;
    padding:12px;
    font-size:15px;
    outline:none;
    background:#fff;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#087b57;
    box-shadow:0 0 0 2px rgba(8,123,87,.08);
}

textarea{
    min-height:100px;
    resize:vertical;
}

.ltr{
    direction:ltr;
    text-align:left;
}

.password-box{
    position:relative;
}

.password-box input{
    padding-right:45px;
}

.eye-btn{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:none;
    cursor:pointer;
    font-size:19px;
}

button{
    border:0;
    border-radius:9px;
    padding:12px 18px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.primary-btn{
    width:100%;
    background:#087b57;
    color:white;
    margin-top:18px;
}

.primary-btn:hover{
    background:#065d43;
}

.secondary-btn{
    background:#e8f1ed;
    color:#07583f;
    margin-top:10px;
    width:100%;
}

.danger-btn{
    background:#c62828;
    color:#fff;
}

.small-btn{
    padding:8px 11px;
    font-size:13px;
}

.message{
    padding:11px;
    border-radius:8px;
    margin-top:12px;
    display:none;
    white-space:pre-line;
    direction:ltr;
    text-align:left;
    word-break:break-word;
}

.success{
    background:#e6f6ed;
    color:#09633f;
    border:1px solid #a9dfc4;
}

.error{
    background:#fdeaea;
    color:#a51d1d;
    border:1px solid #efb1b1;
}

.info{
    background:#e9f3ff;
    color:#18558c;
    border:1px solid #bdd8f2;
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.logout-btn{
    background:#b71c1c;
    color:#fff;
}

.user-info{
    background:#f1f5f3;
    border-radius:8px;
    padding:10px;
    font-size:13px;
    direction:ltr;
    text-align:left;
    word-break:break-all;
}

.file-note{
    font-size:12px;
    color:#6b7379;
    margin-top:5px;
}

.preview{
    display:none;
    margin-top:12px;
    text-align:center;
}

.preview img{
    max-width:220px;
    max-height:220px;
    border-radius:12px;
    border:1px solid #ddd;
    object-fit:contain;
}

.progress{
    display:none;
    margin-top:10px;
}

.progress-bar{
    height:8px;
    background:#087b57;
    border-radius:20px;
    width:0%;
}

.search-box{
    margin-bottom:15px;
}

.product-item{
    border:1px solid #dde3e7;
    border-radius:12px;
    padding:13px;
    margin-bottom:12px;
    display:flex;
    gap:13px;
    align-items:center;
    background:#fff;
}

.product-item img{
    width:90px;
    height:90px;
    object-fit:cover;
    border-radius:9px;
    background:#eee;
}

.product-info{
    flex:1;
    min-width:0;
}

.product-name{
    font-weight:bold;
    font-size:17px;
    margin-bottom:5px;
}

.product-id{
    font-size:12px;
    color:#6b7379;
    direction:ltr;
    text-align:left;
}

.product-price{
    color:#087b57;
    font-weight:bold;
    margin-top:4px;
}

.product-actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.copy-btn{
    background:#e8f1ed;
    color:#07583f;
}

.empty{
    text-align:center;
    padding:25px;
    color:#777;
}

.hidden{
    display:none !important;
}

.loading{
    opacity:.6;
    pointer-events:none;
}

.badge{
    display:inline-block;
    background:#eef6f2;
    color:#087b57;
    border-radius:20px;
    padding:5px 9px;
    font-size:12px;
    margin-top:5px;
}

hr{
    border:0;
    border-top:1px solid #e3e7e9;
    margin:20px 0;
}

@media(max-width:600px){

    .j-letter{
        font-size:32px;
    }

    .container{
        width:94%;
    }

    .card{
        padding:15px;
    }

    .product-item{
        align-items:flex-start;
    }

    .product-item img{
        width:75px;
        height:75px;
    }

    .product-actions{
        margin-top:8px;
    }
}

</style>
</head>

<body>

<header class="main-header">

    <div class="janjua-animation" aria-label="JANJUA">

        <span class="j-letter">
            J<i class="decor d1">🌹</i>
        </span>

        <span class="j-letter">
            A<i class="decor d2">✦</i>
        </span>

        <span class="j-letter">
            N<i class="decor d3">❀</i>
        </span>

        <span class="j-letter">
            J<i class="decor d4">✨</i>
        </span>

        <span class="j-letter">
            U<i class="decor d5">🌸</i>
        </span>

        <span class="j-letter">
            A<i class="decor d6">✦</i>
        </span>

    </div>

    <div class="platform-title">
        DIGITAL MARKETING ONLINE PLATFORM — ADMIN PANEL
    </div>

</header>


<div class="container">

<section id="loginSection" class="card">

    <h2>🔐 Admin Login</
