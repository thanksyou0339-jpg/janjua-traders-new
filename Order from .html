<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Janjua Traders - Order Form</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f6f8;
    color: #222;
}

.container {
    width: min(650px, 94%);
    margin: 25px auto;
}

.header {
    background: #111827;
    color: white;
    text-align: center;
    padding: 22px 15px;
    border-radius: 14px 14px 0 0;
}

.logo {
    font-size: 27px;
    font-weight: bold;
}

.subtitle {
    margin-top: 6px;
    font-size: 14px;
    opacity: .9;
}

.product-box {
    background: white;
    padding: 20px;
    text-align: center;
    border-radius: 0 0 14px 14px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

.product-box img {
    width: 100%;
    max-width: 280px;
    height: 280px;
    object-fit: cover;
    border-radius: 12px;
    background: #eee;
}

.product-name {
    font-size: 24px;
    font-weight: bold;
    margin-top: 18px;
}

.price {
    font-size: 22px;
    font-weight: bold;
    margin-top: 10px;
}

.old-price {
    color: #888;
    margin-top: 5px;
}

.form-box {
    background: white;
    margin-top: 18px;
    padding: 20px;
    border-radius: 14px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

.form-box h2 {
    margin-top: 0;
    text-align: center;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
}

.form-group input,
.form-group textarea,
.form-group select {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    font-size: 16px;
    outline: none;
}

.form-group textarea {
    min-height: 100px;
    resize: vertical;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
    border-color: #111827;
}

.total-box {
    background: #f3f4f6;
    padding: 15px;
    border-radius: 10px;
    margin-top: 18px;
}

.total-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 6px 0;
}

.total-row.final {
    font-size: 20px;
    font-weight: bold;
    border-top: 1px solid #ddd;
    margin-top: 8px;
    padding-top: 12px;
}

.submit-btn {
    width: 100%;
    border: 0;
    padding: 14px;
    margin-top: 18px;
    border-radius: 10px;
    background: #111827;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.submit-btn:hover {
    opacity: .9;
}

.submit-btn:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.message {
    display: none;
    padding: 12px;
    margin-top: 15px;
    border-radius: 9px;
    text-align: center;
    font-weight: bold;
}

.success {
    background: #dcfce7;
    color: #166534;
}

.error {
    background: #fee2e2;
    color: #991b1b;
}

.back-btn {
    display: block;
    text-align: center;
    margin-top: 18px;
    color: #111827;
    text-decoration: none;
    font-weight: bold;
}

.footer {
    text-align: center;
    color: #777;
    font-size: 14px;
    padding: 25px 10px;
}

@media (max-width: 500px) {

    .container {
        width: 94%;
        margin: 15px auto;
    }

    .product-box img {
        height: 230px;
    }

    .product-name {
        font-size: 21px;
    }

    .price {
        font-size: 20px;
    }
}
</style>

</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">JANJUA TRADERS</div>
        <div class="subtitle">Online Shopping Store</div>
    </div>

    <div class="product-box">

        <img
            id="productImage"
            src=""
            alt="Product"
        >

        <div
            class="product-name"
            id="productName"
        >
            Product
        </div>

        <div
            class="price"
            id="productPrice"
        >
            Rs. 0
        </div>

        <div
            class="old-price"
            id="oldPrice"
        ></div>

    </div>


    <div class="form-box">

        <h2>Order Details</h2>

        <form
            id="orderForm"
            action="https://formsubmit.co/ajax/thanksyou0339@gmail.com"
            method="POST"
        >

            <!-- FormSubmit Settings -->

            <input
                type="hidden"
                name="_subject"
                id="emailSubject"
                value="New Janjua Traders Order"
            >

            <input
                type="hidden"
                name="_template"
                value="table"
            >

            <input
                type="hidden"
                name="_captcha"
                value="false"
            >

            <input
                type="hidden"
                name="_url"
                id="formUrl"
                value=""
            >


            <!-- Internal Order Information -->

            <input
                type="hidden"
                name="Order_ID"
                id="orderId"
                value=""
            >

            <input
                type="hidden"
                name="Product"
                id="formProduct"
                value=""
            >

            <input
                type="hidden"
                name="Product_Description"
                id="formDescription"
                value=""
            >

            <input
                type="hidden"
                name="Product_Price"
                id="formProductPrice"
                value=""
            >

            <input
                type="hidden"
                name="Old_Price"
                id="formOldPrice"
                value=""
            >

            <input
                type="hidden"
                name="Supplier"
                id="formSupplier"
                value=""
            >

            <input
                type="hidden"
                name="Product_ID"
                id="formProductId"
                value=""
            >

            <input
                type="hidden"
                name="Product_Link"
                id="formProductLink"
                value=""
            >

            <input
                type="hidden"
                name="Product_Image"
                id="formProductImage"
                value=""
            >

            <input
                type="hidden"
                name="Delivery_Charges"
                id="formDeliveryPrice"
                value="0"
            >

            <input
                type="hidden"
                name="Total_Amount"
                id="formTotalPrice"
                value=""
            >


            <!-- Customer Information -->

            <div class="form-group">

                <label for="customerName">
                    Customer Name
                </label>

                <input
                    type="text"
                    id="customerName"
                    name="Customer_Name"
                    placeholder="اپنا نام لکھیں"
                    required
                >

            </div>


            <div class="form-group">

                <label for="mobile">
                    Mobile / WhatsApp
                </label>

                <input
                    type="tel"
                    id="mobile"
                    name="Mobile_WhatsApp"
                    placeholder="03XXXXXXXXX"
                    required
                >

            </div>


            <div class="form-group">

                <label for="address">
                    Delivery Address
                </label>

                <textarea
                    id="address"
                    name="Delivery_Address"
                    placeholder="مکمل Delivery Address لکھیں"
                    required
                ></textarea>

            </div>


            <div class="form-group">

                <label for="quantity">
                    Quantity
                </label>

                <input
                    type="number"
                    id="quantity"
                    name="Quantity"
                    min="1"
                    max="10"
                    value="1"
                    required
                >

            </div>


            <div class="form-group">

                <label for="platform">
                    Platform
                </label>

                <select
                    id="platform"
                    name="Platform"
                >

                    <option value="Janjua Traders Website">
                        Janjua Traders Website
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="color">
                    Color
                </label>

                <input
                    type="text"
                    id="color"
                    name="Color"
                    placeholder="اگر ضرورت ہو تو Color لکھیں"
                >

            </div>


            <div class="form-group">

                <label for="size">
                    Size
                </label>

                <input
                    type="text"
                    id="size"
                    name="Size"
                    placeholder="اگر ضرورت ہو تو Size لکھیں"
                >

            </div>


            <!-- Total -->

            <div class="total-box">

                <div class="total-row">

                    <span>
                        Product Total
                    </span>

                    <strong id="visibleProductTotal">
                        Rs. 0
                    </strong>

                </div>


                <div class="total-row">

                    <span>
                        Delivery Charges
                    </span>

                    <strong>
                        Rs. 0
                    </strong>

                </div>


                <div class="total-row final">

                    <span>
                        Total Amount
                    </span>

                    <strong id="visibleTotal">
                        Rs. 0
                    </strong>

                </div>

            </div>


            <button
                type="submit"
                id="submitBtn"
                class="submit-btn"
            >
                ORDER CONFIRM کریں
            </button>


            <div
                id="successMessage"
                class="message success"
            ></div>


            <div
                id="errorMessage"
                class="message error"
            ></div>

        </form>


        <a
            href="shop.html"
            class="back-btn"
        >
            ← واپس Shopping پر جائیں
        </a>

    </div>


    <div class="footer">

        <strong>JANJUA TRADERS</strong>

        <br>

        Online Shopping Store

    </div>

</div>


<script src="order-form-script.js"></script>

</body>
</html>
