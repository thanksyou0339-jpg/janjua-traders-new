<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Janjua Traders</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Arial,
        sans-serif;

    background: #f5f6f8;

    color: #222;

    text-align: center;
}

.container {

    width: min(600px, 92%);

    margin: 70px auto;
}

.logo {

    font-size: 32px;

    font-weight: bold;

    margin-bottom: 10px;
}

.subtitle {

    font-size: 18px;

    color: #666;

    margin-bottom: 35px;
}

.shop-button {

    display: inline-block;

    background: #111827;

    color: white;

    text-decoration: none;

    padding: 15px 35px;

    border-radius: 10px;

    font-size: 20px;

    font-weight: bold;
}

.shop-button:hover {

    opacity: .9;
}

.footer {

    margin-top: 60px;

    color: #777;

    font-size: 14px;
}

</style>

</head>

<body>

<div class="container">

    <div class="logo">
        JANJUA TRADERS
    </div>

    <div class="subtitle">
        Online Shopping Store
    </div>

    <a
        class="shop-button"
        href="shop.html"
    >
        SHOP NOW
    </a>

    <div class="footer">

        <strong>
            JANJUA TRADERS
        </strong>

        <br>

        Quality Products • Easy Ordering

    </div>

</div>

</body>

</html>
