<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital Janjua Trading - Order Form</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f6f8;
    color:#222;
}


/* =========================
   HEADER
========================= */

.header{
    background:#111827;
    color:white;
    padding:22px 15px;
    text-align:center;
}

.brand{
    font-size:26px;
    font-weight:bold;
    animation:brandFloat 3s ease-in-out infinite;
}

.subtitle{
    margin-top:7px;
    font-size:13px;
    letter-spacing:1px;
    opacity:.9;
}

@keyframes brandFloat{

    0%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-5px);
    }

    100%{
        transform:translateY(0);
    }

}


/* =========================
   CONTAINER
========================= */

.container{
    width:min(700px,94%);
    margin:22px auto;
}


/* =========================
   CARD
========================= */

.card{
    background:white;
    padding:20px;
    border-radius:14px;
    margin-bottom:18px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}


/* =========================
   PRODUCT
========================= */

.product-box{
    text-align:center;
}

.product-image{
    width:100%;
    max-width:300px;
    height:300px;
    object-fit:cover;
    border-radius:14px;
    background:#eee;
    display:block;
    margin:0 auto 15px;
}

.product-name{
    font-size:23px;
    font-weight:bold;
    margin-bottom:8px;
    direction:auto;
    unicode-bidi:plaintext;
}

.product-price{
    font-size:22px;
    font-weight:bold;
    direction:ltr;
    text-align:center;
}

.old-price{
    margin-top:5px;
    color:#777;
    font-size:15px;
    direction:ltr;
    text-align:center;
}


/* =========================
   FORM
========================= */

h2{
    margin-top:0;
}

label{
    display:block;
    margin-top:14px;
    margin-bottom:6px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:16px;
    font-family:Arial,sans-serif;
    background:white;
}

input[type="text"],
textarea{
    direction:auto;
    unicode-bidi:plaintext;
}

input[type="tel"]{
    direction:ltr;
    text-align:left;
}

select{
    direction:ltr;
    text-align:left;
    cursor:pointer;
}

textarea{
    min-height:100px;
    resize:vertical;
}


/* =========================
   TOTAL
========================= */

.total-box{
    background:#f8fafc;
    border-radius:10px;
    padding:15px;
    margin-top:18px;
}

.total-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-top:8px;
}

.total-row:first-child{
    margin-top:0;
}

.total-label{
    font-weight:bold;
}

.total-value{
    direction:ltr;
    text-align:left;
    font-weight:bold;
}

.grand-total{
    border-top:1px solid #ddd;
    margin-top:12px;
    padding-top:12px;
    font-size:20px;
}


/* =========================
   BUTTON
========================= */

.submit-btn{
    width:100%;
    border:0;
    padding:14px;
    border-radius:10px;
    background:#111827;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    margin-top:20px;
}

.submit-btn:hover{
    opacity:.9;
}

.submit-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}


/* =========================
   MESSAGES
========================= */

.message{
    display:none;
    padding:13px;
    border-radius:9px;
    margin-top:15px;
    line-height:1.6;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}


/* =========================
   FOOTER
========================= */

.footer{
    background:#111827;
    color:white;
    text-align:center;
    padding:22px 15px;
    margin-top:30px;
}

.footer p{
    margin:7px 0 0;
    opacity:.8;
}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    .brand{
        font-size:21px;
    }

    .card{
        padding:15px;
    }

    .product-image{
        height:250px;
    }

    .product-name{
        font-size:20px;
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<header class="header">

    <div class="brand">
        DIGITAL JANJUA TRADING
    </div>

    <div class="subtitle">
        DIGITAL ONLINE MARKETING PLATFORM
    </div>

</header>



<div class="container">


<!-- PRODUCT CARD -->

<div class="card product-box">

    <img
        id="productImage"
        class="product-image"
        src="https://via.placeholder.com/500x500?text=Product"
        alt="Product"
    >


    <div
        id="productName"
        class="product-name"
        dir="auto"
    >
        Product
    </div>


    <div
        id="productPrice"
        class="product-price"
    >
        Rs. 0
    </div>


    <div
        id="oldPrice"
        class="old-price"
    ></div>

</div>



<!-- ORDER FORM -->

<div class="card">

    <h2>
        Order Details
    </h2>


    <form
        id="orderForm"
        autocomplete="on"
    >


        <!-- =========================
             CUSTOMER NAME
        ========================== -->

        <label for="customerName">
            Customer Name
        </label>

        <input
            type="text"
            id="customerName"
            name="Customer_Name"
            dir="auto"
            placeholder="اپنا نام لکھیں"
            required
        >



        <!-- =========================
             MOBILE
        ========================== -->

        <label for="mobile">
            Mobile / WhatsApp Number
        </label>

        <input
            type="tel"
            id="mobile"
            name="Mobile_WhatsApp"
            placeholder="03XXXXXXXXX"
            required
        >



        <!-- =========================
             ADDRESS
        ========================== -->

        <label for="address">
            Complete Delivery Address
        </label>

        <textarea
            id="address"
            name="Delivery_Address"
            dir="auto"
            placeholder="مکمل Delivery Address لکھیں"
            required
        ></textarea>



        <!-- =========================
             QUANTITY
        ========================== -->

        <label for="quantity">
            Quantity
        </label>

        <select
            id="quantity"
            name="Quantity"
            required
        >

            <option value="1" selected>1</option>

            <option value="2">2</option>

            <option value="3">3</option>

            <option value="4">4</option>

            <option value="5">5</option>

            <option value="6">6</option>

            <option value="7">7</option>

            <option value="8">8</option>

            <option value="9">9</option>

            <option value="10">10</option>

        </select>



        <!-- =========================
             PLATFORM
        ========================== -->

        <label for="platform">
            Platform
        </label>

        <select
            id="platform"
            name="Platform"
        >

            <option value="WhatsApp">
                WhatsApp
            </option>

            <option value="Facebook">
                Facebook
            </option>

            <option value="TikTok">
                TikTok
            </option>

            <option value="Website">
                Website
            </option>

            <option value="Other">
                Other
            </option>

        </select>



        <!-- =========================
             COLOR
        ========================== -->

        <label for="color">
            Color
        </label>

        <input
            type="text"
            id="color"
            name="Color"
            dir="auto"
            placeholder="اگر applicable ہو"
        >



        <!-- =========================
             SIZE
        ========================== -->

        <label for="size">
            Size
        </label>

        <input
            type="text"
            id="size"
            name="Size"
            dir="auto"
            placeholder="اگر applicable ہو"
        >



        <!-- =========================
             TOTAL
        ========================== -->

        <div class="total-box">

            <div class="total-row">

                <span class="total-label">
                    Product Total
                </span>

                <span
                    id="visibleProductTotal"
                    class="total-value"
                >
                    Rs. 0
                </span>

            </div>


            <div class="total-row">

                <span class="total-label">
                    Delivery Charges
                </span>

                <span
                    id="visibleDelivery"
                    class="total-value"
                >
                    Rs. 0
                </span>

            </div>


            <div class="total-row grand-total">

                <span class="total-label">
                    Total Amount
                </span>

                <span
                    id="visibleTotal"
                    class="total-value"
                >
                    Rs. 0
                </span>

            </div>

        </div>



        <!-- =========================
             SUBMIT
        ========================== -->

        <button
            type="submit"
            id="submitBtn"
            class="submit-btn"
        >
            ORDER CONFIRM کریں
        </button>


        <div
            id="successMessage"
            class="message success"
        ></div>


        <div
            id="errorMessage"
            class="message error"
        ></div>



        <!-- =========================
             FORMSUBMIT SETTINGS
        ========================== -->

        <input
            type="hidden"
            name="_subject"
            id="emailSubject"
        >

        <input
            type="hidden"
            name="_template"
            value="table"
        >

        <input
            type="hidden"
            name="_captcha"
            value="false"
        >

        <input
            type="hidden"
            name="_url"
            id="formUrl"
        >



        <!-- =========================
             ORDER DATA
        ========================== -->

        <input
            type="hidden"
            name="Order_ID"
            id="orderId"
        >

        <input
            type="hidden"
            name="Product"
            id="formProduct"
        >

        <input
            type="hidden"
            name="Product_Description"
            id="formDescription"
        >

        <input
            type="hidden"
            name="Product_Price"
            id="formProductPrice"
        >

        <input
            type="hidden"
            name="Old_Price"
            id="formOldPrice"
        >

        <input
            type="hidden"
            name="Product_ID"
            id="formProductId"
        >

        <input
            type="hidden"
            name="Product_Image"
            id="formProductImage"
        >

        <input
            type="hidden"
            name="Delivery_Charges"
            id="formDeliveryPrice"
        >

        <input
            type="hidden"
            name="Total_Amount"
            id="formTotalPrice"
        >

    </form>

</div>

</div>



<!-- FOOTER -->

<footer class="footer">

    <strong>
        DIGITAL JANJUA TRADING
    </strong>

    <p>
        DIGITAL ONLINE MARKETING PLATFORM
    </p>

</footer>



<script
    src="order-form-script.js"
>
</script>

</body>

</html>
