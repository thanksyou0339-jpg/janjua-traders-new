<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>JANJUA — Order Form</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f5f8;
    color:#17202a;
}

.container{
    width:94%;
    max-width:900px;
    margin:20px auto;
}

.card{
    background:white;
    border-radius:16px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.header{
    background:
        linear-gradient(
            135deg,
            #07111f,
            #10243b
        );
    color:white;
    padding:25px 15px;
    text-align:center;
}

.logo{
    font-size:35px;
    font-weight:900;
    letter-spacing:4px;
}

.sub{
    margin-top:5px;
    letter-spacing:2px;
    font-size:13px;
}

.product-box{
    display:grid;
    grid-template-columns:220px 1fr;
    gap:20px;
    align-items:start;
}

@media(max-width:650px){

    .product-box{
        grid-template-columns:1fr;
    }

}

.product-box img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    border-radius:14px;
    background:#eee;
}

.product-name{
    font-size:25px;
    font-weight:bold;
    margin-bottom:10px;
}

.description{
    color:#667085;
    line-height:1.7;
    margin-bottom:12px;
}

.price{
    font-size:26px;
    font-weight:bold;
}

.old-price{
    color:#888;
    margin-right:10px;
}

.delivery{
    display:inline-block;
    margin-top:12px;
    padding:8px 12px;
    border-radius:20px;
    background:#dcfce7;
    color:#166534;
    font-weight:bold;
}

label{
    display:block;
    font-weight:bold;
    margin-top:12px;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    margin-top:6px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:15px;
}

textarea{
    min-height:90px;
    resize:vertical;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 17px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.submit-btn{
    width:100%;
    background:#111827;
    color:white;
    margin-top:20px;
}

.submit-btn:disabled{
    opacity:.6;
}

.message{
    display:none;
    padding:12px;
    border-radius:10px;
    margin-top:15px;
}

.message.show{
    display:block;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.receipt{
    max-width:700px;
    margin:20px auto;
}

.receipt-head{
    text-align:center;
    border-bottom:2px solid #111827;
    padding-bottom:15px;
    margin-bottom:15px;
}

.receipt-logo{
    font-size:30px;
    font-weight:900;
    letter-spacing:3px;
}

.tracking{
    background:#eff6ff;
    color:#1d4ed8;
    border-radius:10px;
    padding:12px;
    text-align:center;
    font-weight:bold;
    margin-bottom:15px;
}

.receipt-product{
    display:flex;
    gap:15px;
    align-items:center;
    border-bottom:1px solid #ddd;
    padding-bottom:15px;
    margin-bottom:15px;
}

.receipt-product img{
    width:90px;
    height:90px;
    object-fit:cover;
    border-radius:10px;
}

.receipt-table{
    width:100%;
    border-collapse:collapse;
}

.receipt-table td{
    padding:9px 4px;
    border-bottom:1px solid #eee;
}

.receipt-table td:first-child{
    font-weight:bold;
}

.total-row td{
    font-size:18px;
    font-weight:bold;
}

.receipt-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:20px;
}

.receipt-actions button{
    flex:1;
    min-width:130px;
}

.download{
    background:#15803d;
    color:white;
}

.share{
    background:#2563eb;
    color:white;
}

.print{
    background:#111827;
    color:white;
}

.new-order{
    background:#e5e7eb;
}

@media print{

    body{
        background:white;
    }

    .no-print,
    .header,
    #orderCard{
        display:none !important;
    }

    .receipt{
        width:100%;
        max-width:none;
        margin:0;
        box-shadow:none;
    }

}

</style>

</head>


<body>


<header class="header">

    <div class="logo">
        JANJUA
    </div>

    <div class="sub">
        DIGITAL MARKETING
    </div>

    <div class="sub">
        ONLINE SHOPPING PLATFORM
    </div>

</header>


<main class="container">


<!-- PRODUCT -->

<div class="card">

    <div class="product-box">

        <img
            id="productImage"
            src=""
            alt="Product"
        >


        <div>

            <div
                id="productName"
                class="product-name"
            >
                Product
            </div>


            <div
                id="productDescription"
                class="description"
            ></div>


            <div>

                <span
                    id="productPrice"
                    class="price"
                >
                    Rs. 0
                </span>


                <del
                    id="oldPrice"
                    class="old-price"
                ></del>

            </div>


            <div
                id="deliveryBadge"
                class="delivery"
            >
                Free Delivery
            </div>


            <div
                id="deliveryNote"
                style="margin-top:8px;color:#667085;"
            ></div>

        </div>

    </div>

</div>


<!-- ORDER FORM -->

<div
    id="orderCard"
    class="card"
>

    <h2>
        🛒 Customer Order
    </h2>


    <form
        id="orderForm"
        action="https://formsubmit.co/ajax/thanksyou0339@gmail.com"
        method="POST"
    >


        <label>
            Customer Name *
        </label>

        <input
            type="text"
            id="customerName"
            name="Customer_Name"
            required
        >


        <label>
            Mobile / WhatsApp *
        </label>

        <input
            type="tel"
            id="mobile"
            name="Mobile_WhatsApp"
            required
        >


        <label>
            Delivery Address *
        </label>

        <textarea
            id="address"
            name="Delivery_Address"
            required
        ></textarea>


        <label>
            Quantity *
        </label>

        <select
            id="quantity"
            name="Quantity"
            required
        >

            <option value="1">
                1
            </option>

            <option value="2">
                2
            </option>

            <option value="3">
                3
            </option>

            <option value="4">
                4
            </option>

            <option value="5">
                5
            </option>

            <option value="6">
                6
            </option>

            <option value="7">
                7
            </option>

            <option value="8">
                8
            </option>

            <option value="9">
                9
            </option>

            <option value="10">
                10
            </option>

        </select>


        <label>
            Platform
        </label>

        <select
            id="platform"
            name="Platform"
        >

            <option value="">
                Select
            </option>

            <option value="WhatsApp">
                WhatsApp
            </option>

            <option value="TikTok">
                TikTok
            </option>

            <option value="Facebook">
                Facebook
            </option>

            <option value="Other">
                Other
            </option>

        </select>


        <label>
            Color
        </label>

        <input
            type="text"
            id="color"
            name="Color"
        >


        <label>
            Size
        </label>

        <input
            type="text"
            id="size"
            name="Size"
        >


        <!-- HIDDEN -->

        <input
            type="hidden"
            name="_subject"
            value="JANJUA — New Customer Order"
        >

        <input
            type="hidden"
            name="_template"
            value="table"
        >

        <input
            type="hidden"
            name="_captcha"
            value="false"
        >

        <input
            type="hidden"
            id="formUrl"
            name="_url"
        >

        <input
            type="hidden"
            id="hiddenOrderId"
            name="Order_ID"
        >

        <input
            type="hidden"
            id="hiddenProduct"
            name="Product"
        >

        <input
            type="hidden"
            id="hiddenDescription"
            name="Product_Description"
        >

        <input
            type="hidden"
            id="hiddenPrice"
            name="Product_Price"
        >

        <input
            type="hidden"
            id="hiddenOldPrice"
            name="Old_Price"
        >

        <input
            type="hidden"
            id="hiddenProductId"
            name="Product_ID"
        >

        <input
            type="hidden"
            id="hiddenProductImage"
            name="Product_Image"
        >

        <input
            type="hidden"
            id="hiddenDeliveryStatus"
            name="Delivery_Status"
        >

        <input
            type="hidden"
            id="hiddenDeliveryCharges"
            name="Delivery_Charges"
        >

        <input
            type="hidden"
            id="hiddenTotal"
            name="Total_Amount"
        >


        <button
            type="submit"
            id="submitBtn"
            class="submit-btn"
        >
            PLACE ORDER
        </button>


        <div
            id="formMessage"
            class="message"
        ></div>


    </form>

</div>


<!-- RECEIPT -->

<section
    id="receiptSection"
    class="card receipt"
    style="display:none;"
>


    <div class="receipt-head">

        <div class="receipt-logo">
            JANJUA
        </div>

        <strong>
            DIGITAL MARKETING
        </strong>

        <div>
            ONLINE SHOPPING PLATFORM
        </div>

    </div>


    <div
        id="receiptOrderId"
        class="tracking"
    >
        Tracking ID
    </div>


    <div class="receipt-product">

        <img
            id="receiptImage"
            src=""
            alt="Product"
        >


        <div>

            <strong
                id="receiptProductName"
            >
                Product
            </strong>


            <div
                id="receiptDate"
                style="margin-top:7px;color:#667085;"
            ></div>

        </div>

    </div>


    <table class="receipt-table">

        <tr>

            <td>
                Customer
            </td>

            <td id="receiptCustomer">
            </td>

        </tr>


        <tr>

            <td>
                Mobile / WhatsApp
            </td>

            <td id="receiptMobile">
            </td>

        </tr>


        <tr>

            <td>
                Quantity
            </td>

            <td id="receiptQuantity">
            </td>

        </tr>


        <tr>

            <td>
                Product Price
            </td>

            <td id="receiptPrice">
            </td>

        </tr>


        <tr>

            <td>
                Delivery
            </td>

            <td id="receiptDelivery">
            </td>

        </tr>


        <tr class="total-row">

            <td>
                Total
            </td>

            <td id="receiptTotal">
            </td>

        </tr>

    </table>


    <div
        id="receiptDeliveryInstruction"
        style="
            margin-top:15px;
            padding:12px;
            background:#f9fafb;
            border-radius:10px;
        "
    ></div>


    <div class="receipt-actions no-print">

        <button
            id="downloadReceiptBtn"
            class="download"
        >
            DOWNLOAD
        </button>


        <button
            id="shareReceiptBtn"
            class="share"
        >
            SHARE
        </button>


        <button
            id="printReceiptBtn"
            class="print"
        >
            PRINT / PDF
        </button>


        <button
            id="newOrderBtn"
            class="new-order"
        >
            NEW ORDER
        </button>

    </div>

</section>


</main>


<script
    type="module"
    src="order-form-script.js"
></script>


</body>

</html>
