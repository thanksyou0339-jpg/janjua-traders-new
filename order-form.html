<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>JANJUA - Order Form</title>


<style>

*{
    box-sizing:border-box;
}


html,
body{
    margin:0;
    padding:0;
    width:100%;
    max-width:100%;
    overflow-x:hidden;
}


body{
    font-family:Arial,sans-serif;
    background:#f3f5f8;
    color:#17202a;
}


/* =====================================================
   MAIN MOBILE FRAME
===================================================== */

.page-wrap{
    width:100%;
    max-width:520px;
    margin:0 auto;
    padding:12px;
    overflow:hidden;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    width:100%;
    background:#111827;
    color:#fff;
    border-radius:14px;
    padding:16px 12px;
    text-align:center;
    margin-bottom:12px;
    overflow:hidden;
}


.brand{
    font-size:30px;
    font-weight:900;
    letter-spacing:2px;
    line-height:1.1;
}


.sub-brand{
    font-size:11px;
    margin-top:4px;
    letter-spacing:1px;
    opacity:.9;
}


/* =====================================================
   PRODUCT CARD
===================================================== */

.product-box{
    width:100%;
    max-width:100%;
    background:#fff;
    border-radius:16px;
    padding:12px;
    overflow:hidden;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
}


/* =====================================================
   IMAGE FRAME
===================================================== */

.product-image-frame{
    width:100%;
    max-width:100%;
    height:300px;
    background:#f7f7f7;
    border-radius:12px;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    margin:0 auto 14px;
}


.product-image-frame img{
    display:block;

    width:100%;
    height:100%;

    max-width:100%;
    max-height:100%;

    object-fit:contain;

    object-position:center;

    margin:0;
    padding:0;
}


/* =====================================================
   PRODUCT INFORMATION
===================================================== */

.product-info{
    width:100%;
    max-width:100%;
    overflow:hidden;
}


.product-name{
    width:100%;
    max-width:100%;

    margin:0 0 8px;

    font-size:21px;
    line-height:1.35;

    overflow-wrap:anywhere;
    word-break:break-word;
}


.product-description{
    width:100%;
    max-width:100%;

    margin:0 0 12px;

    padding:10px;

    background:#f7f8fa;

    border-radius:10px;

    font-size:14px;
    line-height:1.65;

    white-space:normal;

    overflow-wrap:anywhere;
    word-break:break-word;

    overflow:hidden;
}


.price-row{
    width:100%;
    max-width:100%;

    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px;

    margin-bottom:10px;

    overflow:hidden;
}


.price{
    font-size:22px;
    font-weight:900;
}


.old-price{
    font-size:14px;
    text-decoration:line-through;
    color:#777;
}


.delivery-badge{
    display:inline-block;

    max-width:100%;

    padding:6px 10px;

    border-radius:20px;

    background:#e8f7ed;
    color:#16753b;

    font-size:12px;
    font-weight:bold;

    overflow-wrap:anywhere;
}


.delivery-note{
    width:100%;
    max-width:100%;

    margin-top:8px;

    font-size:13px;
    line-height:1.5;

    overflow-wrap:anywhere;
    word-break:break-word;
}


/* =====================================================
   FORM
===================================================== */

.form-box{
    width:100%;
    max-width:100%;

    background:#fff;

    margin-top:12px;

    padding:14px;

    border-radius:16px;

    box-shadow:0 4px 18px rgba(0,0,0,.08);

    overflow:hidden;
}


.form-title{
    font-size:20px;
    font-weight:900;
    margin-bottom:12px;
}


.form-group{
    width:100%;
    max-width:100%;
    margin-bottom:12px;
}


.form-group label{
    display:block;
    margin-bottom:6px;
    font-size:14px;
    font-weight:bold;
}


.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    max-width:100%;

    padding:12px;

    border:1px solid #d5d9df;

    border-radius:10px;

    background:#fff;

    font-size:15px;

    outline:none;
}


.form-group textarea{
    min-height:100px;
    resize:vertical;

    overflow-wrap:anywhere;
    word-break:break-word;
}


.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
    border-color:#111827;
}


.submit-btn{
    width:100%;
    max-width:100%;

    border:0;

    padding:14px;

    border-radius:11px;

    background:#111827;
    color:#fff;

    font-size:17px;
    font-weight:900;

    cursor:pointer;
}


.submit-btn:disabled{
    opacity:.65;
    cursor:not-allowed;
}


/* =====================================================
   RECEIPT
===================================================== */

#receiptSection{
    width:100%;
    max-width:100%;

    background:#fff;

    margin-top:14px;

    padding:14px;

    border-radius:16px;

    box-shadow:0 4px 18px rgba(0,0,0,.08);

    overflow:hidden;
}


.receipt-image{
    width:100%;
    max-width:100%;

    height:220px;

    object-fit:contain;

    display:block;

    border-radius:10px;

    background:#f7f7f7;

    margin-bottom:12px;
}


.receipt-row{
    width:100%;
    max-width:100%;

    display:flex;

    justify-content:space-between;

    gap:10px;

    padding:8px 0;

    border-bottom:1px solid #eee;

    overflow:hidden;
}


.receipt-row span{
    overflow-wrap:anywhere;
    word-break:break-word;
}


.receipt-actions{
    width:100%;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:8px;

    margin-top:14px;
}


.receipt-actions button{
    width:100%;

    border:0;

    padding:11px;

    border-radius:10px;

    background:#111827;

    color:#fff;

    font-weight:bold;
}


.new-order-btn{
    width:100%;

    margin-top:8px;

    border:0;

    padding:12px;

    border-radius:10px;

    background:#e5e7eb;

    color:#111827;

    font-weight:bold;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .page-wrap{
        padding:8px;
    }


    .header{
        border-radius:12px;
        padding:14px 10px;
    }


    .brand{
        font-size:26px;
    }


    .product-box,
    .form-box,
    #receiptSection{
        border-radius:13px;
        padding:10px;
    }


    .product-image-frame{
        height:250px;
    }


    .product-name{
        font-size:19px;
    }


    .product-description{
        font-size:13px;
        line-height:1.6;
    }

}


/* =====================================================
   PRINT
===================================================== */

@media print{

    body{
        background:#fff;
    }


    .header,
    .product-box,
    .form-box{
        display:none !important;
    }


    #receiptSection{
        display:block !important;

        width:100%;
        max-width:100%;

        margin:0;
        padding:0;

        box-shadow:none;
        border:0;
    }


    .receipt-actions,
    .new-order-btn{
        display:none !important;
    }

}

</style>

</head>


<body>


<div class="page-wrap">


    <!-- =================================================
         HEADER
    ================================================= -->

    <div class="header">

        <div class="brand">
            JANJUA
        </div>

        <div class="sub-brand">
            DIGITAL MARKETING
            <br>
            ONLINE SHOPPING PLATFORM
        </div>

    </div>


    <!-- =================================================
         PRODUCT
    ================================================= -->

    <div class="product-box">

        <div class="product-image-frame">

            <img
                id="productImage"
                src=""
                alt="Product"
            >

        </div>


        <div class="product-info">

            <h1
                id="productName"
                class="product-name"
            >
                Product
            </h1>


            <p
                id="productDescription"
                class="product-description"
            ></p>


            <div class="price-row">

                <span
                    id="productPrice"
                    class="price"
                ></span>


                <span
                    id="oldPrice"
                    class="old-price"
                ></span>

            </div>


            <div
                id="deliveryBadge"
                class="delivery-badge"
            ></div>


            <div
                id="deliveryNote"
                class="delivery-note"
            ></div>

        </div>

    </div>


    <!-- =================================================
         ORDER FORM
    ================================================= -->

    <div class="form-box">

        <div class="form-title">
            Order Form
        </div>


        <form
            id="orderForm"
            action="https://formsubmit.co/ajax/thanksyou0339@gmail.com"
            method="POST"
        >


            <div class="form-group">

                <label for="customerName">
                    نام
                </label>

                <input
                    type="text"
                    id="customerName"
                    name="Customer_Name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="mobile">
                    موبائل / WhatsApp
                </label>

                <input
                    type="tel"
                    id="mobile"
                    name="Mobile_WhatsApp"
                    required
                >

            </div>


            <div class="form-group">

                <label for="address">
                    مکمل پتہ
                </label>

                <textarea
                    id="address"
                    name="Delivery_Address"
                    required
                ></textarea>

            </div>


            <div class="form-group">

                <label for="quantity">
                    Quantity
                </label>

                <select
                    id="quantity"
                    name="Quantity"
                >

                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>

                </select>

            </div>


            <div class="form-group">

                <label for="platform">
                    Order Platform
                </label>

                <select
                    id="platform"
                    name="Platform"
                >

                    <option value="WhatsApp">
                        WhatsApp
                    </option>

                    <option value="Facebook">
                        Facebook
                    </option>

                    <option value="TikTok">
                        TikTok
                    </option>

                    <option value="Website">
                        Website
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="color">
                    Color
                </label>

                <input
                    type="text"
                    id="color"
                    name="Color"
                >

            </div>


            <div class="form-group">

                <label for="size">
                    Size
                </label>

                <input
                    type="text"
                    id="size"
                    name="Size"
                >

            </div>


            <!-- =================================================
                 FORMSUBMIT SETTINGS
            ================================================= -->

            <input
                type="hidden"
                name="_subject"
                value="JANJUA — New Customer Order"
            >


            <input
                type="hidden"
                name="_template"
                value="table"
            >


            <input
                type="hidden"
                name="_captcha"
                value="false"
            >


            <input
                type="hidden"
                id="formUrl"
                name="_url"
                value=""
            >


            <!-- =================================================
                 ORDER ID
            ================================================= -->

            <input
                type="hidden"
                id="hiddenOrderId"
                name="Order_ID"
                value=""
            >


            <!-- =================================================
                 PRODUCT DATA
            ================================================= -->

            <input
                type="hidden"
                id="hiddenProduct"
                name="Product"
                value=""
            >


            <input
                type="hidden"
                id="hiddenDescription"
                name="Product_Description"
                value=""
            >


            <input
                type="hidden"
                id="hiddenPrice"
                name="Product_Price"
                value=""
            >


            <input
                type="hidden"
                id="hiddenOldPrice"
                name="Old_Price"
                value=""
            >


            <input
                type="hidden"
                id="hiddenProductId"
                name="Product_ID"
                value=""
            >


            <input
                type="hidden"
                id="hiddenProductImage"
                name="Product_Image"
                value=""
            >


            <input
                type="hidden"
                id="hiddenDeliveryStatus"
                name="Delivery_Status"
                value=""
            >


            <input
                type="hidden"
                id="hiddenDeliveryCharges"
                name="Delivery_Charges"
                value=""
            >


            <input
                type="hidden"
                id="hiddenTotal"
                name="Total_Amount"
                value=""
            >


            <!-- =================================================
                 JANJUA LINK
            ================================================= -->

            <input
                type="hidden"
                id="hiddenJanjuaLink"
                name="JANJUA_Order_Link"
                value=""
            >


            <!-- =================================================
                 SUPPLIER LINK
            ================================================= -->

            <input
                type="hidden"
                id="hiddenSupplierLink"
                name="Original_Supplier_Link"
                value=""
            >


            <!-- =================================================
                 SUBMIT
            ================================================= -->

            <button
                type="submit"
                class="submit-btn"
            >
                ORDER CONFIRM کریں
            </button>

        </form>

    </div>


    <!-- =================================================
         RECEIPT
    ================================================= -->

    <section
        id="receiptSection"
        style="display:none;"
    >

        <h2>
            Order Receipt
        </h2>


        <img
            id="receiptImage"
            class="receipt-image"
            src=""
            alt="Product"
        >


        <div class="receipt-row">

            <strong>
                Product
            </strong>

            <span
                id="receiptProductName"
            ></span>

        </div>


        <div class="receipt-row">

            <strong>
                Date
            </strong>

            <span
                id="receiptDate"
            ></span>

        </div>


        <div class="receipt-row">

            <strong>
                Order ID
            </strong>

            <span
                id="receiptOrderId"
            ></span>

        </div>


        <div class="receipt-row">

            <strong>
                Customer
            </strong>

            <span
                id="receiptCustomer"
            ></span>

        </div>


        <div class="receipt-row">

            <strong>
                Mobile
            </strong>

            <span
                id="receiptMobile"
            ></span>

        </div>


        <div class="receipt-row">

            <strong>
                Quantity
            </strong>

            <span
                id="receiptQuantity"
            ></span>

        </div>


        <div class="receipt-row">

            <strong>
                Price
            </strong>

            <span
                id="receiptPrice"
            ></span>

        </div>


        <div class="receipt-row">

            <strong>
                Delivery
            </strong>

            <span
                id="receiptDelivery"
            ></span>

        </div>


        <div class="receipt-row">

            <strong>
                Total
            </strong>

            <span
                id="receiptTotal"
            ></span>

        </div>


        <div
            id="receiptDeliveryInstruction"
            style="
                margin-top:12px;
                line-height:1.6;
                overflow-wrap:anywhere;
                word-break:break-word;
            "
        ></div>


        <div class="receipt-actions">

            <button
                type="button"
                id="downloadReceiptBtn"
            >
                Download
            </button>


            <button
                type="button"
                id="shareReceiptBtn"
            >
                Share
            </button>


            <button
                type="button"
                id="printReceiptBtn"
            >
                Print / PDF
            </button>

        </div>


        <button
            type="button"
            id="newOrderBtn"
            class="new-order-btn"
        >
            New Order
        </button>

    </section>

</div>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script
    type="module"
    src="order-form-script.js"
></script>


</body>

</html>
